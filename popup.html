<!doctype html>
<!-- 「初始」扩展弹窗快捷面板（v8.5.0）。
     点击浏览器工具栏「初始」图标弹出的轻量设置面板（青柠起始页同款交互）。
     v8.5.2 起只保留「完整设置直达」这一个入口：v8.5.0 引入的两个快捷
     开关已按用户要求整体移除，设置项不再由弹窗提供，页面侧也不再有选项。
     样式零依赖（内联 CSS）：zinc 刻度 + 强调紫，深浅色跟随
     settings.themeMode（system 回退 prefers-color-scheme）。
     CSP 律：MV3 扩展页禁内联 script，逻辑全部走外链 popup.js。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>初始 · 快捷面板</title>
    <style>
      :root {
        --acc: #8b5cf6;
        --bg: #fafafa;
        --fg: #27272a;
        --fg2: #52525b;
        --fg3: #a1a1aa;
        --line: rgba(24, 24, 27, 0.08);
        --track: rgba(24, 24, 27, 0.06);
      }
      html.dark {
        --bg: #18181b;
        --fg: #f4f4f5;
        --fg2: #d4d4d8;
        --fg3: #71717a;
        --line: rgba(255, 255, 255, 0.09);
        --track: rgba(255, 255, 255, 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 336px;
        padding: 16px 16px 12px;
        background: var(--bg);
        color: var(--fg);
        font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei",
          system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      header img {
        width: 22px;
        height: 22px;
        display: block;
      }
      header .t {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.22em;
      }
      header .v {
        margin-left: auto;
        font-size: 10px;
        font-weight: 300;
        letter-spacing: 0.08em;
        color: var(--fg3);
        font-variant-numeric: tabular-nums;
      }
      .more {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        margin-top: 13px;
        padding: 8px 0;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg2);
        font-size: 11px;
        font-weight: 300;
        letter-spacing: 0.2em;
        cursor: pointer;
        transition: background-color 0.25s ease, color 0.25s ease;
      }
      .more:hover {
        background: color-mix(in srgb, var(--fg) 6%, transparent);
        color: var(--fg);
      }
      footer {
        margin-top: 11px;
        text-align: center;
        font-size: 9px;
        font-weight: 300;
        letter-spacing: 0.24em;
        color: var(--fg3);
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="start.svg" alt="" aria-hidden="true" />
      <div class="t">初始</div>
      <span class="v" id="ver"></span>
    </header>

    <main>
      <button class="more" id="open-settings">打开完整设置</button>
    </main>

    <footer>初始 · 新标签页</footer>

    <script src="popup.js"></script>
  </body>
</html>
