<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ChuShi Netease</title>
<style>
:root{color-scheme:light dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{
  font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  user-select:none;
  --ink:#27272a;--ink2:#71717a;--ink3:#a1a1aa;--line:rgba(0,0,0,.08);
  --pr:rgba(0,0,0,.10);--card2:rgba(255,255,255,.55);
  --acc:var(--w-accent,#8b5cf6);
  --acc12:color-mix(in oklab,var(--acc) 12%,transparent);
  --acc20:color-mix(in oklab,var(--acc) 20%,transparent);
  --acc32:color-mix(in oklab,var(--acc) 32%,transparent);
  --ez:cubic-bezier(.22,1,.36,1);--r9:999px;
}
[data-theme=dark] body{
  --ink:#f4f4f5;--ink2:#a1a1aa;--ink3:#71717a;--line:rgba(255,255,255,.09);
  --pr:rgba(255,255,255,.12);--card2:rgba(39,39,44,.55);
}
img{-webkit-user-drag:none;user-select:none}
.np{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  padding:12px 14px 10px;gap:8px}
/* ---------- 头部 ---------- */
.nh{display:flex;align-items:center;gap:8px;flex:none}
.nh .lg{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--acc32),var(--acc12));border-radius:7px;color:var(--acc)}
.nh .lg svg{width:13px;height:13px;fill:currentColor}
.nh b{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.chip{font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:var(--r9);
  padding:2px 8px;transition:color .3s,border-color .3s}
.chip.ok{color:var(--acc);border-color:var(--acc32)}
.nx{margin-left:auto;appearance:none;border:0;cursor:pointer;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;border-radius:var(--r9);
  color:var(--ink2);background:var(--card2);transition:transform .25s var(--ez),color .3s}
.nx:hover{transform:scale(1.08);color:var(--ink)}
.nx svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
/* ---------- 页签 + 搜索 ---------- */
.tabs{display:flex;gap:4px;flex:none;background:var(--pr);border-radius:var(--r9);padding:3px}
.tabs b{flex:1;text-align:center;font-size:11.5px;font-weight:500;color:var(--ink2);
  padding:5px 0;border-radius:var(--r9);cursor:pointer;transition:color .25s,background-color .25s}
.tabs b.on{background:var(--card2);color:var(--acc);font-weight:600}
.sr{display:flex;gap:6px;flex:none}
.sr input{flex:1;min-width:0;appearance:none;border:1px solid var(--line);background:var(--card2);
  border-radius:var(--r9);padding:7px 13px;font-size:12px;color:var(--ink);outline:none;
  font-family:inherit;transition:border-color .25s}
.sr input:focus{border-color:var(--acc32)}
.sr input::placeholder{color:var(--ink3)}
.sr button{appearance:none;border:0;background:var(--acc);color:#fff;border-radius:var(--r9);
  padding:0 15px;font-size:12px;cursor:pointer;font-family:inherit;flex:none;
  transition:filter .25s,transform .2s var(--ez)}
.sr button:hover{filter:brightness(1.12)}
.sr button:active{transform:scale(.94)}
/* ---------- 列表 ---------- */
.lst{flex:1;min-height:0;overflow-y:auto;border-radius:12px;scrollbar-width:thin;
  scrollbar-color:var(--pr) transparent;position:relative}
.lst::-webkit-scrollbar{width:4px}
.lst::-webkit-scrollbar-thumb{background:var(--pr);border-radius:2px}
.subh{font-size:10.5px;color:var(--ink3);padding:2px 4px 6px;display:flex;align-items:center;gap:6px}
.bk{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--ink2);
  border-radius:var(--r9);font-size:10px;padding:2px 9px;cursor:pointer;font-family:inherit}
.bk:hover{color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;cursor:pointer;
  transition:background-color .2s}
.row:hover{background:var(--pr)}
.row.cur{background:var(--acc12)}
.row.cur .rt{color:var(--acc)}
.ri{flex:1;min-width:0}
.rt{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{font-size:10.5px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.vip{flex:none;font-size:9px;color:var(--acc);border:1px solid var(--acc32);border-radius:4px;
  padding:0 3px;line-height:13px}
.plc{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;cursor:pointer;
  transition:background-color .2s}
.plc:hover{background:var(--pr)}
.pli{width:38px;height:38px;border-radius:9px;flex:none;background:linear-gradient(135deg,var(--acc32),var(--acc12));
  display:flex;align-items:center;justify-content:center;color:var(--acc)}
.pli svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pn{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{font-size:10.5px;color:var(--ink3);margin-top:1px}
.emp{height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lst.empty .emp{display:flex}
.emp svg{width:26px;height:26px;fill:none;stroke:var(--ink3);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.emp span{font-size:11.5px;color:var(--ink3)}
/* ---------- 扫码登录 ---------- */
.qrbox{flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;gap:8px;display:none}
.qrbox.on{display:flex}
.qrbox canvas{width:112px;height:112px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.qst{font-size:12px;color:var(--ink);font-weight:500}
.qtip{font-size:10.5px;color:var(--ink3);text-align:center;line-height:1.6}
/* ---------- 播放条 ---------- */
.bar{flex:none;display:none;flex-direction:column;gap:2px;padding-top:2px}
.bar.on{display:flex}
.brow{display:flex;align-items:center;gap:9px}
.cov{width:42px;height:42px;border-radius:10px;flex:none;object-fit:cover;
  background:linear-gradient(135deg,var(--acc32),var(--acc12));opacity:0;transition:opacity .5s var(--ez)}
.cov.on{opacity:1}
.nm{flex:1;min-width:0}
.tt{font-size:12.5px;font-weight:560;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{font-size:10.5px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tri{font-size:9px;color:#d97706;border:1px solid rgba(217,119,6,.4);border-radius:4px;padding:0 3px;margin-left:5px}
.nb{appearance:none;border:0;background:transparent;color:var(--ink2);width:28px;height:28px;flex:none;
  border-radius:var(--r9);display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:11px;font-family:inherit;
  transition:transform .22s var(--ez),background-color .3s,color .3s}
.nb:hover{background:var(--card2);color:var(--acc);transform:scale(1.06)}
.nb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb svg.fi{fill:currentColor;stroke:none}
.seek{height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none;position:relative}
.rail{position:relative;width:100%;height:6px;border-radius:4px;background:var(--pr);overflow:hidden;
  transform:scaleY(.667);transform-origin:50% 50%;transition:transform .2s var(--ez);will-change:transform}
.seek:hover .rail,.seek.drag .rail{transform:scaleY(1)}
.rail i{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:4px;background:var(--acc)}
.tmrow{display:flex;align-items:center;gap:4px}
.tm{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none;width:34px}
.tm.r{text-align:right}
.ctls{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.pb{width:34px;height:34px;border-radius:var(--r9);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  appearance:none;border:0;background:transparent;color:var(--ink2);
  transition:transform .22s var(--ez),background-color .3s,color .3s}
.pb:hover{background:var(--card2);color:var(--ink);transform:scale(1.06)}
.pb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pb svg.fi{fill:currentColor;stroke:none}
.pmain{width:38px;height:38px;color:#fff;background:var(--acc);position:relative;
  box-shadow:0 4px 14px var(--acc32),0 1px 0 rgba(255,255,255,.22) inset}
.pmain:hover{color:#fff;background:var(--acc);filter:brightness(1.12)}
.pmain svg{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
  transition:opacity .16s ease,transform .16s var(--ez)}
.pmain svg.off{opacity:0;transform:scale(.55)}
.md{font-size:9px;letter-spacing:.05em}
/* ---------- 歌词浮层 ---------- */
.lyr{position:absolute;left:10px;right:10px;top:52px;bottom:128px;z-index:3;border-radius:14px;
  background:var(--card2);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);
  display:none;flex-direction:column;overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.16)}
.lyr.on{display:flex}
.lh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;flex:none}
.lh b{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.lx{appearance:none;border:0;background:var(--card2);color:var(--ink2);width:22px;height:22px;
  border-radius:var(--r9);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;margin-left:8px}
.lx svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.lsc{flex:1;min-height:0;overflow-y:auto;padding:0 14px 12px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.lsc::-webkit-scrollbar{display:none}
.ln{padding:7px 0;cursor:pointer}
.ln .lx1{font-size:13px;color:var(--ink2);line-height:1.5;transition:color .25s}
.ln .lx2{font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.5}
.ln.on .lx1{color:var(--acc);font-weight:600}
.ln .w{background-image:linear-gradient(90deg,var(--acc) 0%,var(--acc) var(--p,0%),var(--ink2) var(--p,0%));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--ink3)}
.tst{position:absolute;left:50%;bottom:132px;transform:translateX(-50%) translateY(8px);z-index:4;
  background:rgba(0,0,0,.78);color:#fff;font-size:11px;border-radius:var(--r9);padding:7px 15px;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ez);white-space:nowrap;
  max-width:90%;overflow:hidden;text-overflow:ellipsis}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="np">
  <div class="nh">
    <span class="lg"><svg viewBox="0 0 24 24"><path d="M9 3v10.55A4 4 0 1 0 11 17V7h8V3H9z"/></svg></span>
    <b>网易云播放</b>
    <span class="chip" id="chip">检测中</span>
    <button class="nx" id="x" title="收起"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="tabs" id="tabs">
    <b data-t="d" class="on">每日推荐</b><b data-t="s">搜索</b><b data-t="p">我的歌单</b>
  </div>
  <div class="sr" id="srw" style="display:none">
    <input id="q" placeholder="歌曲 / 歌手" maxlength="40"><button id="go">搜索</button>
  </div>
  <div class="lst empty" id="list">
    <div class="emp">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 17V8l7-1.5V15"/><circle cx="8.5" cy="17" r="1.6"/><circle cx="15.5" cy="15" r="1.6"/></svg>
      <span id="emp">加载中…</span>
    </div>
  </div>
  <div class="qrbox" id="qrbox">
    <canvas id="qr" width="224" height="224"></canvas>
    <div class="qst" id="qst">生成二维码…</div>
    <div class="qtip">手机网易云音乐 App 扫一扫登录<br>登录后可看我的歌单 · VIP 歌曲跟账号权限走</div>
  </div>
  <div class="bar" id="bar">
    <div class="brow">
      <img class="cov" id="cov" alt="">
      <div class="nm">
        <div class="tt"><span id="tt">未在播放</span><span class="tri" id="tri" style="display:none">试听</span></div>
        <div class="ar" id="ar">点列表里的歌开始播放</div>
      </div>
      <button class="nb md" id="md" title="播放模式">顺序</button>
      <button class="nb" id="bw" title="歌词">词</button>
    </div>
    <div class="seek" id="seek"><div class="rail"><i id="fill"></i></div></div>
    <div class="tmrow">
      <span class="tm" id="t1">0:00</span>
      <div class="ctls">
        <button class="pb" id="pv"><svg viewBox="0 0 24 24"><path d="M17 5v14l-9-7z" class="fi"/><path d="M6 5v14" stroke-linecap="round"/></svg></button>
        <button class="pb pmain" id="pp">
          <svg id="icPlay" class="off" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" class="fi"/></svg>
          <svg id="icPause" viewBox="0 0 24 24"><path d="M7.5 5.5h3.2v13H7.5zM13.3 5.5h3.2v13h-3.2z" class="fi"/></svg>
        </button>
        <button class="pb" id="nx"><svg viewBox="0 0 24 24"><path d="M7 5v14l9-7z" class="fi"/><path d="M18 5v14" stroke-linecap="round"/></svg></button>
      </div>
      <button class="nb" id="vv" title="音量"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" class="fi"/><path d="M15.5 8.5a5 5 0 0 1 0 7" id="vw1"/></svg></button>
      <span class="tm r" id="t2">0:00</span>
    </div>
  </div>
  <div class="lyr" id="lyr">
    <div class="lh"><b id="ltitle">歌词</b><button class="lx" id="lx"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="lsc" id="lsc"></div>
    <div class="lhint" id="lhint">暂无歌词</div>
  </div>
  <div class="tst" id="tst"></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var fmt=function(ms){ms=Math.max(0,ms|0);var s=(ms/1000)|0;return ((s/60)|0)+":"+("0"+(s%60)).slice(-2)};
var noteT=null;
function note(m){var t=$("tst");t.textContent=m;t.classList.add("on");clearTimeout(noteT);noteT=setTimeout(function(){t.classList.remove("on")},2200)}
function api(p,d){return chushi.ne.api(p,d).then(function(r){if(!r.ok)throw new Error(r.err||"接口失败");return r.data})}
function au(a,o){return chushi.ne.audio(a,o).then(function(r){if(!r.ok)throw new Error(r.err||"操作失败");return r.data})}
/* ---------- 状态 ---------- */
var S={tab:"d",rows:[],pls:null,q:-1,mode:0,ly:null,lyOn:false,lastSeq:0,curLy:-1,
  logged:false,uid:null,qrKey:"",pollT:null,drag:false,vols:[1,.6,.25,0],vi:0,dur:0};
function norm(o){return{id:o.id,name:o.name||"",
  ar:(o.ar||o.artists||[]).map(function(a){return a.name||""}).join(" / "),
  al:(o.al||o.album||{}).name||"",
  dt:o.dt||o.duration||0,fee:o.fee||0}}
/* ---------- 音频状态帧（timeupdate ≈4Hz） ---------- */
function onAudio(s){
  if(!s||s.seq<=S.lastSeq)return;S.lastSeq=s.seq;S.dur=s.duration||0;
  $("fill").style.width=(s.duration?Math.min(100,s.position/s.duration*100):0)+"%";
  $("t1").textContent=fmt(s.position*1000);
  $("t2").textContent="-"+fmt((s.duration-s.position)*1000);
  $("icPlay").classList[s.playing?"add":"remove"]("off");
  $("icPause").classList[s.playing?"remove":"add"]("off");
  if(s.name){$("tt").textContent=s.name;$("ar").textContent=s.artist||"";
    $("tri").style.display=s.trial?"":"none"}
  if(s.cover&&$("cov").getAttribute("src")!==s.cover){$("cov").src=s.cover;$("cov").classList.add("on")}
  if(s.ended)next();
  if(s.sysCmd==="next")next();
  if(s.sysCmd==="prev")prev();
  if(S.lyOn)lyTick(s.position*1000);
}
chushi.ne.sub(onAudio);
/* ---------- 队列 ---------- */
function play(list,i){
  if(!list||!list[i])return;S.q=i;var r=list[i];mark();
  api("/weapi/song/enhance/player/url/v1",{ids:"["+r.id+"]",level:"standard",encodeType:"flac"})
  .then(function(d){var x=(d.data||[])[0];
    if(!x||!x.url){note((r.fee===1?"VIP 歌曲":r.name)+" 暂无法播放（版权或登录限制）");return}
    $("tt").textContent=r.name;$("ar").textContent=r.ar;$("cov").classList.remove("on");
    $("bar").classList.add("on");
    au("load",{url:x.url.replace(/^http:/,"https:"),
      meta:{id:String(r.id),name:r.name,artist:r.ar,album:r.al,cover:"",trial:!!x.freeTrialInfo}})
    .then(function(){getPic(r);getLyric(r.id)})
    .catch(function(e){note("播放失败："+e.message)});
  }).catch(function(e){note(e.message)});
}
function getPic(r){
  api("/weapi/v3/song/detail",{c:'[{"id":'+r.id+"}]",ids:"["+r.id+"]"})
  .then(function(d){var s=(d.songs||[])[0],p=s&&s.al&&s.al.picUrl;
    if(p)au("meta",{meta:{cover:String(p).replace(/^http:/,"https:")}}).catch(function(){});
  }).catch(function(){});
}
function next(){if(!S.rows.length)return;var n=S.q+1;
  if(S.mode===1)n=S.q;
  else if(S.mode===2&&S.rows.length>1){do{n=(Math.random()*S.rows.length)|0}while(n===S.q)}
  else if(n>=S.rows.length)n=0;
  play(S.rows,n)}
function prev(){if(!S.rows.length)return;var n=S.q-1;if(n<0)n=S.rows.length-1;play(S.rows,n)}
function mark(){var old=document.querySelector(".row.cur");if(old)old.classList.remove("cur");
  var el=document.querySelector('.row[data-i="'+S.q+'"]');if(el)el.classList.add("cur")}
/* ---------- 列表渲染 ---------- */
function emp(t){var l=$("list");l.style.display="";$("qrbox").classList.remove("on");
  /* 自重建式空态：rows() 重写 innerHTML 会销毁旧 .emp 节点，这里每次重建防 null */
  l.innerHTML='<div class="emp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 17V8l7-1.5V15"/><circle cx="8.5" cy="17" r="1.6"/><circle cx="15.5" cy="15" r="1.6"/></svg><span>'+esc(t)+"</span></div>";
  l.classList.add("empty")}
function rows(list,hint){
  S.rows=list;$("list").style.display="";$("qrbox").classList.remove("on");
  var h=hint||"";
  list.forEach(function(r,i){
    h+='<div class="row" data-i="'+i+'"><div class="ri"><div class="rt">'+esc(r.name)+
      '</div><div class="ra">'+esc(r.ar)+(r.al?" · "+esc(r.al):"")+"</div></div>"+
      (r.fee===1||r.fee===8?'<span class="vip">VIP</span>':r.fee===4?'<span class="vip">专</span>':"")+
      '<div class="rd">'+fmt(r.dt)+"</div></div>";
  });
  $("list").innerHTML=h;$("list").classList.toggle("empty",!list.length);
  if(!list.length)emp("没有内容");
}
$("list").addEventListener("click",function(e){
  var el=e.target&&e.target.closest?e.target.closest(".row"):null;
  if(!el)return;play(S.rows,+el.getAttribute("data-i"));
});
/* ---------- 页签 ---------- */
var busy=false;
function tab(t){
  S.tab=t;stopPoll();
  var bs=$("tabs").querySelectorAll("b");
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].getAttribute("data-t")===t);
  $("srw").style.display=t==="s"?"":"none";
  if(t==="s"){$("list").style.display="";$("qrbox").classList.remove("on");

function qrMatrix(text){
  var bytes=[],str=unescape(encodeURIComponent(text)),i,j;
  for(i=0;i<str.length;i++)bytes.push(str.charCodeAt(i));
  var CAP=[17,32,53,78,106],DCW=[19,34,55,80,108],ECB=[7,10,15,20,26],
      N=[21,25,29,33,37],v=0;
  while(v<5&&bytes.length>CAP[v])v++;
  if(bytes.length>CAP[4])return null;
  var n=N[v],dc=DCW[v],ec=ECB[v];
  /* GF(256)（poly 0x11d） */
  var EXP2=[],LOG=[];
  (function(){var x=1;for(i=0;i<255;i++){EXP2[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=285}
    for(i=255;i<512;i++)EXP2[i]=EXP2[i-255]})();
  function gmul(a,b){return(a===0||b===0)?0:EXP2[LOG[a]+LOG[b]]}
  /* 数据位流 */
  var bits=[];
  function push(v2,len){for(var k=len-1;k>=0;k--)bits.push((v2>>>k)&1)}
  push(4,4);push(bytes.length,8);
  for(i=0;i<bytes.length;i++)push(bytes[i],8);
  var capBits=dc*8;
  var ds=[],end=bits.length;
  for(i=0;i<dc;i++){
    var b0=0;
    for(j=0;j<8;j++){var bi=i*8+j;b0=(b0<<1)|((bi<end)?bits[bi]:0)}
    ds.push(b0);
  }
  /* 终止符（0 位）→ 字节对齐 → 0xEC/0x11 交替补齐 */
  var sb=Math.ceil(end/8),pad=[236,17];
  for(i=sb;i<dc;i++)ds[i]=pad[(i-sb)%2];
  /* RS 纠错（单块）：g=∏(x-α^i) 低次在前；长除取余（高次在前） */
  var g=new Array(ec+1).fill(0);g[0]=1;
  for(i=0;i<ec;i++){
    var ng=new Array(ec+1).fill(0);
    for(j=0;j<=i;j++){ng[j]^=gmul(g[j],EXP2[i]);ng[j+1]^=g[j]}
    g=ng;
  }
  var work=ds.slice();
  for(i=0;i<ec;i++)work.push(0);
  for(i=0;i<dc;i++){
    var f=work[i];if(f===0)continue;
    for(j=0;j<=ec;j++)work[i+j]^=gmul(g[ec-j],f);
  }
  var all=ds.concat(work.slice(dc)),dataBits=[];
  for(i=0;i<all.length;i++)for(j=7;j>=0;j--)dataBits.push((all[i]>>j)&1);
  /* 矩阵：null=未填 */
  var m=[];
  for(i=0;i<n;i++){m.push(new Array(n));for(j=0;j<n;j++)m[i][j]=null}
  function finder(r,c){var dy,dx;
    for(dy=-1;dy<=7;dy++)for(dx=-1;dx<=7;dx++){
      var rr=r+dy,cc=c+dx;if(rr<0||cc<0||rr>=n||cc>=n)continue;
      var on=(dy>=0&&dy<=6&&(dx===0||dx===6))||(dx>=0&&dx<=6&&(dy===0||dy===6))||
        (dy>=2&&dy<=4&&dx>=2&&dx<=4);
      m[rr][cc]=on?1:0}}
  finder(0,0);finder(0,n-7);finder(n-7,0);
  for(i=8;i<n-8;i++){m[6][i]=i%2===0?1:0;m[i][6]=i%2===0?1:0}
  if(n>21){var a=n-7;
    for(var dy2=-2;dy2<=2;dy2++)for(var dx2=-2;dx2<=2;dx2++){
      m[a+dy2][a+dx2]=Math.max(Math.abs(dy2),Math.abs(dx2))!==1?1:0}}
  /* 格式信息（ECC L=01 · 掩码2=010）· BCH(15,5) 生成元 0x537 · 掩码 0x5412
     两份拷贝：①围绕左上 finder（列8竖排+行8横排）②右上横排+左下竖排 */
  var fd=(1<<3)|2,f3=fd<<10;
  for(i=14;i>=10;i--)if((f3>>i)&1)f3^=0x537<<(i-10);
  var fb=((fd<<10)|f3)^0x5412;
  for(i=0;i<=5;i++)m[i][8]=(fb>>i)&1;
  m[7][8]=(fb>>6)&1;m[8][8]=(fb>>7)&1;m[8][7]=(fb>>8)&1;
  for(i=9;i<15;i++)m[8][14-i]=(fb>>i)&1;
  for(i=0;i<8;i++)m[8][n-1-i]=(fb>>i)&1;
  for(i=8;i<15;i++)m[n-15+i][8]=(fb>>i)&1;
  m[n-8][8]=1; /* dark module */
  /* 数据之字扫描（右→左列对，跳 col6）+ 掩码2：列 %3==0 */
  var col=n-1,up=true,idx=0;
  while(col>0&&idx<dataBits.length){
    if(col===6)col--;
    for(var k2=0;k2<n;k2++){
      var r2=up?n-1-k2:k2;
      for(var cdx=0;cdx<2;cdx++){
        var c2=col-cdx;
        if(r2<0||r2>=n||c2<0||c2>=n||m[r2][c2]!==null)continue;
        var bit=idx<dataBits.length?dataBits[idx++]:0;
        if((c2%3)===0)bit^=1;
        m[r2][c2]=bit;
      }
    }
    col-=2;up=!up;
  }
  return m;
}
function drawQR(cv,text){
  var m=qrMatrix(text);if(!m){note("二维码生成失败");return false}
  var n=m.length,ctx=cv.getContext("2d"),W=cv.width,sc=W/(n+16);
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,W);
  ctx.fillStyle="#18181b";
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(m[r][c]===1)
    ctx.fillRect((c+8)*sc,(r+8)*sc,Math.ceil(sc),Math.ceil(sc));
  return true;
}
/* ---------- 歌词 ---------- */
function parseLrc(t){var m=[];(t||"").replace(/\r/g,"").split("\n").forEach(function(l){
  var ts=l.match(/\[\d+:\d+(\.\d+)?\]/g);if(!ts)return;
  var x=l.replace(/\[[^\]]*\]/g,"").trim();if(!x)return;
  ts.forEach(function(t0){var p=t0.slice(1,-1).split(":");m.push({t:((+p[0]*60+ +p[1])*1000)|0,x:x})})});
  m.sort(function(a,b){return a.t-b.t});return m}
function parseTly(t){var m={};(t||"").replace(/\r/g,"").split("\n").forEach(function(l){
  var ts=l.match(/^\[(\d+:\d+(\.\d+)?)\]/);if(!ts)return;
  var x=l.replace(/\[[^\]]*\]/g,"").trim();if(!x)return;
  var p=ts[1].split(":");m[Math.round((+p[0]*60+ +p[1])*1000)]=x});return m}
function parseYrc(t){var m=[];(t||"").split("\n").forEach(function(l){
  if(l.charAt(0)!=="[")return;var h=l.match(/^\[(\d+),(\d+)\](.*)$/);if(!h)return;
  var st=+h[1],ws=[],w,re=/\((\d+),(\d+),0\)([^(]*)/g;
  while((w=re.exec(h[3])))if(w[3])ws.push({t:st+ +w[1],d:+w[2],x:w[3]});
  if(ws.length)m.push({t:st,w:ws})});return m}
function getLyric(id){
  S.ly=null;S.curLy=-1;$("lhint").style.display="none";$("lsc").innerHTML="";
  api("/weapi/song/lyric",{id:String(id),lv:"-1",kv:"-1",tv:"-1",yv:"-1"}).then(function(d){
    var lrc=(d.lrc&&d.lrc.lyric)||"",tly=(d.tlyric&&d.tlyric.lyric)||"",yrc=(d.yrc&&d.yrc.lyric)||"";
    var tl=parseTly(tly);
    var lines=parseLrc(lrc).map(function(x){
      for(var k in tl)if(Math.abs(k-x.t)<=500)return{t:x.t,x:x.x,tr:tl[k]};
      return{t:x.t,x:x.x,tr:null}});
    S.ly={y:yrc?parseYrc(yrc):null,l:lines};
    if(S.lyOn)lyRender();
  }).catch(function(){S.ly={y:null,l:[]};if(S.lyOn)lyRender()});
}

function lyTick(pos){
  if(!S.ly)return;
  var y=S.ly.y,l=S.ly.l,i,ci=-1;
  if(y&&y.length){
    for(i=0;i<y.length;i++)if(y[i].t<=pos)ci=i;
    if(ci!==S.curLy){S.curLy=ci;
      var els=$("lsc").children;
      for(i=0;i<els.length;i++)els[i].classList[i===ci?"add":"remove"]("on");
      if(ci>=0&&els[ci])try{els[ci].scrollIntoView({block:"center",behavior:"smooth"})}catch(e){}}
    if(ci>=0){var ws=$("lsc").children[ci].querySelectorAll(".w"),words=y[ci].w;
      for(i=0;i<ws.length&&i<words.length;i++){
        var w2=words[i],p=w2.d>0?Math.max(0,Math.min(1,(pos-w2.t)/w2.d))*100:0;
        if(ws[i]._lp!==p){ws[i]._lp=p;ws[i].style.setProperty("--p",p+"%")}
      }
    }
    return;
  }
  if(!l.length)return;
  for(i=0;i<l.length;i++)if(l[i].t<=pos)ci=i;
  if(ci!==S.curLy){S.curLy=ci;
    var els2=$("lsc").children;
    for(i=0;i<els2.length;i++)els2[i].classList[i===ci?"add":"remove"]("on");
    if(ci>=0&&els2[ci])try{els2[ci].scrollIntoView({block:"center",behavior:"smooth"})}catch(e){}}
}
