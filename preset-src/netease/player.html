<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ChuShi Netease</title>
<style>
/* ============================================================
   初始 · 网易云播放器 v4（v8.7.28 整页重写）
   命令面板画布 560×540：品牌行 / 常驻搜索行 / 双页签（搜索页签退役，
   搜索只走顶部命令行）/ 列表区 / 底部播放条 / 歌词浮层 / 提示浮层
   铁律：一切 hover 反馈 = 轻微放大（scale），禁止位移分量
   ============================================================ */
:root{color-scheme:light dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{
  font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  user-select:none;
  --ink:#26262b;--ink2:#6d6d78;--ink3:#a5a5b0;--line:rgba(25,25,40,.09);
  --wash:rgba(30,30,60,.055);--pane:rgba(255,255,255,.6);
  --lybg:rgba(255,255,255,.88);--popsolid:rgba(255,255,255,.96);
  --acc:var(--w-accent,#8b5cf6);
  --acc12:color-mix(in oklab,var(--acc) 12%,transparent);
  --acc20:color-mix(in oklab,var(--acc) 20%,transparent);
  --acc32:color-mix(in oklab,var(--acc) 32%,transparent);
  --ez:cubic-bezier(.22,1,.36,1);--r9:999px;
}
[data-theme=dark] body{
  --ink:#f3f3f7;--ink2:#a0a0ac;--ink3:#6f6f7c;--line:rgba(255,255,255,.09);
  --wash:rgba(255,255,255,.09);--pane:rgba(40,40,46,.6);
  --lybg:rgba(24,24,28,.86);--popsolid:rgba(37,37,43,.97);
}
img{-webkit-user-drag:none;user-select:none}
button{font-family:inherit}
/* ---------- 画布 ---------- */
.np{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  padding:13px 16px 12px;gap:9px}
/* ---------- 品牌行 ---------- */
.nh{display:flex;align-items:center;gap:8px;flex:none}
.nh .lg{width:21px;height:21px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--acc32),var(--acc12));border-radius:7px;color:var(--acc)}
.nh .lg svg{width:13px;height:13px;fill:currentColor}
.nh b{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.chip{font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:var(--r9);
  padding:2px 8px;cursor:pointer;transition:color .3s,border-color .3s,transform .22s var(--ez)}
.chip:hover{transform:scale(1.05)}
.chip.ok{color:var(--acc);border-color:var(--acc32)}
.chip.warn{color:#d97706;border-color:rgba(217,119,6,.4)}
.hx{margin-left:auto;appearance:none;border:0;cursor:pointer;width:24px;height:24px;flex:none;
  display:flex;align-items:center;justify-content:center;border-radius:var(--r9);
  color:var(--ink2);background:var(--pane);transition:transform .22s var(--ez),color .3s}
.hx:hover{transform:scale(1.08);color:var(--ink)}
.hx svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
/* ---------- 常驻搜索行（命令面板签名行：唯一搜索入口，任何视图回车直达） ---------- */
.qsr{display:flex;align-items:center;gap:8px;flex:none;height:38px;padding:0 5px 0 12px;
  border:1px solid var(--line);border-radius:12px;background:var(--pane);
  transition:border-color .25s}
.qsr:focus-within{border-color:var(--acc32)}
.qsr>svg{width:15px;height:15px;flex:none;fill:none;stroke:var(--ink3);stroke-width:1.8;stroke-linecap:round}
.qsr input{flex:1;min-width:0;background:transparent;border:0;outline:0;height:100%;
  font-size:13px;color:var(--ink);font-family:inherit}
.qsr input::placeholder{color:var(--ink3)}
.qsr button{appearance:none;border:0;background:var(--acc);color:#fff;border-radius:9px;
  padding:0 14px;height:28px;font-size:12px;cursor:pointer;flex:none;
  transition:filter .25s,transform .2s var(--ez)}
.qsr button:hover{filter:brightness(1.1);transform:scale(1.05)}
.qsr button:active{transform:scale(.94)}
/* ---------- 页签（每日推荐 / 我的歌单——搜索视图由命令行唤起，不占页签） ---------- */
.seg{display:flex;gap:4px;flex:none;background:var(--wash);border-radius:var(--r9);padding:3px}
.seg b{flex:1;text-align:center;font-size:11.5px;font-weight:500;color:var(--ink2);
  padding:4px 0;border-radius:var(--r9);cursor:pointer;
  transition:color .3s,background-color .3s,font-weight .3s}
.seg b.on{background:var(--pane);color:var(--acc);font-weight:600}
/* ---------- 列表区 ---------- */
.ls{flex:1;min-height:0;overflow-y:auto;border-radius:12px;position:relative;padding:2px;
  scrollbar-width:thin;scrollbar-color:var(--wash) transparent}
.ls::-webkit-scrollbar{width:4px}
.ls::-webkit-scrollbar-thumb{background:var(--wash);border-radius:2px}
.ls.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}
.ls.pgrid .subh{grid-column:1/-1}
.subh{font-size:10.5px;color:var(--ink3);padding:2px 4px 6px;display:flex;align-items:center;gap:6px}
.bk{appearance:none;border:1px solid var(--line);background:var(--pane);color:var(--ink2);
  border-radius:var(--r9);font-size:10px;padding:2px 9px;cursor:pointer;
  transition:color .25s,transform .2s var(--ez)}
.bk:hover{color:var(--ink);transform:scale(1.06)}
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;cursor:pointer;
  transition:background-color .2s}
.row:hover{background:var(--wash)}
.row.cur{background:var(--acc12)}
.row.cur .rt{color:var(--acc)}
.ri{flex:1;min-width:0}
.rt{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{font-size:10.5px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.vip{flex:none;font-size:9px;color:var(--acc);border:1px solid var(--acc32);border-radius:4px;
  padding:0 3px;line-height:13px}
.plc{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;cursor:pointer;
  transition:background-color .2s}
.plc:hover{background:var(--wash)}
.pli{width:38px;height:38px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--acc32),var(--acc12));
  display:flex;align-items:center;justify-content:center;color:var(--acc)}
.pli svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.pn{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{font-size:10.5px;color:var(--ink3);margin-top:1px}
.emp{height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ls.empty .emp{display:flex}
.emp svg{width:26px;height:26px;fill:none;stroke:var(--ink3);stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.emp span{font-size:11.5px;color:var(--ink3)}
/* ---------- 扫码登录 ---------- */
.qrbox{flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;gap:8px;display:none}
.qrbox.on{display:flex}
.qrbox canvas{width:112px;height:112px;border-radius:10px;border:1px solid var(--line);
  background:#fff;cursor:pointer}
.qst{font-size:12px;color:var(--ink);font-weight:500}
.qtip{font-size:10.5px;color:var(--ink3);text-align:center;line-height:1.6}
/* ---------- 播放条 ---------- */
.bd{flex:none;display:none;flex-direction:column;gap:4px;padding-top:2px}
.bd.on{display:flex}
.brow{display:flex;align-items:center;gap:10px}
/* 频谱高光律动：.glow 前置画在封面底下（同 context 律），光环只从四周晕出、
   封面本体恒定不动；宿主 WebAudio 128 段 30Hz 包络帧驱动 opacity/scale，
   只写合成器友好属性；暂停/静默清 inline 交还样式表；reduced-motion 熄灯 */
.covw{position:relative;flex:none;display:block}
.covw .glow{position:absolute;inset:-7px;border-radius:16px;background:var(--acc);opacity:0;
  filter:blur(12px);pointer-events:none}
.cov{position:relative;z-index:1;display:block;width:46px;height:46px;border-radius:11px;object-fit:cover;cursor:pointer;
  background:linear-gradient(135deg,var(--acc32),var(--acc12));opacity:0;
  transition:opacity .5s var(--ez),transform .22s var(--ez)}
.cov.on{opacity:1}
.cov.on:hover{transform:scale(1.07)}
.nm{flex:1;min-width:0}
.tt{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{font-size:11px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tri{font-size:9px;color:#d97706;border:1px solid rgba(217,119,6,.4);border-radius:4px;padding:0 3px;margin-left:5px}
.pill{appearance:none;border:0;background:transparent;color:var(--ink2);width:28px;height:28px;flex:none;
  border-radius:var(--r9);display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:11px;
  transition:transform .22s var(--ez),background-color .3s,color .3s}
.pill:hover{background:var(--pane);color:var(--acc);transform:scale(1.06)}
.pill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pill svg.fi{fill:currentColor;stroke:none}
.pill.sm{font-size:9px;letter-spacing:.05em}
#bw.on{color:#fff;background:var(--acc)}
/* 音质三选一小弹窗：sq 药丸外包 .sqw 相对锚，.qpop 自其上方浮出（右下 origin），
   三档单选（对勾跟随当前档），点选项/点外部/Esc 收起；选中即应用 */
.sqw{position:relative;flex:none}
.qpop{position:absolute;right:0;bottom:calc(100% + 10px);z-index:6;min-width:150px;
  background:var(--popsolid);backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--line);border-radius:13px;padding:4px;
  box-shadow:0 10px 30px rgba(0,0,0,.16);
  opacity:0;transform:translateY(5px) scale(.95);transform-origin:100% 100%;
  pointer-events:none;transition:opacity .18s var(--ez),transform .18s var(--ez)}
.qpop.on{opacity:1;transform:none;pointer-events:auto}
.qpop button{display:flex;width:100%;align-items:center;gap:7px;border:0;background:transparent;
  border-radius:9px;padding:7px 9px;font-size:12px;color:var(--ink);cursor:pointer;
  text-align:left;transition:background-color .2s}
.qpop button:hover{background:var(--wash)}
.qpop button i{font-style:normal;margin-left:auto;font-size:10px;color:var(--ink3)}
.qpop button .ck{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;visibility:hidden;color:var(--acc)}
.qpop button.cur{color:var(--acc);font-weight:600}
.qpop button.cur .ck{visibility:visible}
/* 三键不让位律（同 SMTC 面板）：tmrow 流内只留时间/音量，传输键组 .ctls
   绝对居中于面板正中——两侧内容任何增减，上一首/播放/下一首位置恒定 */
.vol{display:flex;align-items:center;gap:1px;flex:none;margin-left:auto}
.vrail{position:relative;width:64px;height:16px;cursor:pointer;touch-action:none}
.vrail .vr{position:absolute;left:0;top:50%;width:100%;height:5px;margin-top:-2.5px;border-radius:3px;background:var(--wash)}
.vrail i{position:absolute;left:0;top:50%;height:5px;margin-top:-2.5px;border-radius:3px;background:var(--acc);width:70%}
/* 旋钮居中用负 margin（铁律：hover 纯 scale，transform 不承担定位职责） */
.vrail b{position:absolute;top:50%;left:70%;width:12px;height:12px;margin:-6px 0 0 -6px;
  border-radius:var(--r9);background:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.28);
  transition:transform .2s var(--ez)}
.vrail:hover b,.vrail.drag b{transform:scale(1.18)}
.sk{height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none;position:relative}
.rail{position:relative;width:100%;height:6px;border-radius:4px;background:var(--wash);overflow:hidden;
  transform:scaleY(.667);transform-origin:50% 50%;transition:transform .2s var(--ez);will-change:transform}
.sk:hover .rail,.sk.drag .rail{transform:scaleY(1)}
.rail i{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:4px;background:var(--acc)}
.tmrow{position:relative;display:flex;align-items:center;gap:4px;min-height:34px}
.tm{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none;width:34px}
.tm.r{text-align:right}
.ctls{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px}
.pb{width:34px;height:34px;border-radius:var(--r9);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  appearance:none;border:0;background:transparent;color:var(--ink2);
  transition:transform .22s var(--ez),background-color .3s,color .3s}
.pb:hover{background:var(--pane);color:var(--ink);transform:scale(1.06)}
.pb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pb svg.fi{fill:currentColor;stroke:none}
.pmain{width:38px;height:38px;color:#fff;background:var(--acc);position:relative;
  box-shadow:0 4px 14px var(--acc32),0 1px 0 rgba(255,255,255,.22) inset}
.pmain:hover{color:#fff;background:var(--acc);filter:brightness(1.1);transform:scale(1.05)}
.pmain svg{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
  transition:opacity .16s ease,transform .16s var(--ez)}
.pmain svg.off{opacity:0;transform:scale(.55)}
/* ---------- 歌词浮层 ---------- */
.lyr{position:absolute;left:12px;right:12px;top:127px;bottom:117px;z-index:3;border-radius:14px;
  background:var(--lybg);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);
  display:none;flex-direction:column;overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.16)}
.lyr.on{display:flex}
.lh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;flex:none}
.lh b{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.lc{appearance:none;border:0;background:var(--pane);color:var(--ink2);width:22px;height:22px;
  border-radius:var(--r9);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;margin-left:8px;
  transition:transform .2s var(--ez),color .3s}
.lc:hover{transform:scale(1.1);color:var(--ink)}
.lc svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
/* 歌词动效（SMTC 面板同语言）：容器 transform 滚动（offsetTop 居中数学）+
   呼吸缩放（当前 1.06/邻行 .94）+ 高斯景深（未唱 2px/已唱 1.1px/当前 0）+
   已唱行扫光定格 100% 渐隐 + 翻译行 height 过渡 + 双层实体色 clip-path 扫色 */
.lsc{flex:1;min-height:0;position:relative;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent,#000 16px,#000 calc(100% - 16px),transparent);
  mask-image:linear-gradient(transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.lsi{position:absolute;left:14px;right:14px;top:0;transition:transform .45s var(--ez);will-change:transform}
.ln{padding:7px 4px;text-align:center;font-size:13.5px;font-weight:600;line-height:1.45;overflow-wrap:anywhere;
  color:var(--ink3);transform:scale(.94);transform-origin:50% 50%;filter:blur(2px);cursor:pointer;
  transition:color .35s ease,transform .45s var(--ez),filter .45s var(--ez)}
.ln.on{color:var(--ink);transform:scale(1.06);filter:blur(0)}
.ln.done{color:var(--ink2);filter:blur(1.1px)}
.w{position:relative;display:inline-block;color:inherit}
.ln.on .w{color:color-mix(in oklab,var(--ink) 45%,var(--ink3))}
.w .ov{position:absolute;left:0;top:0;color:var(--acc);pointer-events:none;white-space:nowrap;
  clip-path:inset(-8% calc(100% - var(--p,0%)) -8% 0);transition:opacity .6s ease}
.ln.done .w .ov{opacity:0}
.trw{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr;height:0;opacity:0;overflow:hidden;
  transition:height .38s var(--ez),opacity .38s ease}
.ln.on .trw{height:17px;opacity:1}
.trw .tr{min-height:0;font-size:11px;font-weight:400;color:var(--ink2);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--ink3)}
/* ---------- 提示浮层 ---------- */
.tst{position:absolute;left:50%;bottom:130px;transform:translateX(-50%) scale(.94);z-index:7;
  background:rgba(20,20,26,.8);color:#fff;font-size:11px;border-radius:var(--r9);padding:7px 15px;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ez);white-space:nowrap;
  max-width:90%;overflow:hidden;text-overflow:ellipsis}
.tst.on{opacity:1;transform:translateX(-50%) scale(1)}
</style>
</head>
<body>
<div class="np">
  <div class="nh">
    <span class="lg"><svg viewBox="0 0 24 24"><path d="M9 3v10.55A4 4 0 1 0 11 17V7h8V3H9z"/></svg></span>
    <b>初始网易云</b>
    <span class="chip" id="chip">检测中</span>
    <button class="hx" id="x" title="收起"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="qsr">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="搜索歌曲 / 歌手，回车直达" maxlength="40">
    <button id="go">搜索</button>
  </div>
  <div class="seg" id="tabs">
    <b data-t="d" class="on">每日推荐</b><b data-t="p">我的歌单</b>
  </div>
  <div class="ls empty" id="list">
    <div class="emp">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 17V8l7-1.5V15"/><circle cx="8.5" cy="17" r="1.6"/><circle cx="15.5" cy="15" r="1.6"/></svg>
      <span id="emp">加载中…</span>
    </div>
  </div>
  <div class="qrbox" id="qrbox">
    <canvas id="qr" width="224" height="224"></canvas>
    <div class="qst" id="qst">生成二维码…</div>
    <div class="qtip">手机网易云音乐 App 扫一扫登录<br>登录后可看我的歌单 · VIP 歌曲跟账号权限走</div>
  </div>
  <div class="bd" id="bar">
    <div class="brow">
      <span class="covw"><span class="glow" id="glow"></span><img class="cov" id="cov" alt="" title="歌词"></span>
      <div class="nm">
        <div class="tt"><span id="tt">未在播放</span><span class="tri" id="tri" style="display:none">试听</span></div>
        <div class="ar" id="ar">点列表里的歌开始播放</div>
      </div>
      <span class="sqw">
        <button class="pill" id="sq" title="音质">标准</button>
        <span class="qpop" id="qpop">
          <button data-q="standard"><svg class="ck" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>标准<i>128K</i></button>
          <button data-q="exhigh"><svg class="ck" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>极高<i>320K</i></button>
          <button data-q="lossless"><svg class="ck" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>无损<i>FLAC · 黑胶</i></button>
        </span>
      </span>
      <button class="pill sm" id="md" title="播放模式">顺序</button><button class="pill" id="bw" title="全局歌词">词</button>
    </div>
    <div class="sk" id="seek"><div class="rail"><i id="fill"></i></div></div>
    <div class="tmrow">
      <span class="tm" id="t1">0:00</span>
      <div class="ctls">
        <button class="pb" id="pv"><svg viewBox="0 0 24 24"><path d="M17 5v14l-9-7z" class="fi"/><path d="M6 5v14" stroke-linecap="round"/></svg></button>
        <button class="pb pmain" id="pp">
          <svg id="icPlay" class="off" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" class="fi"/></svg>
          <svg id="icPause" viewBox="0 0 24 24"><path d="M7.5 5.5h3.2v13H7.5zM13.3 5.5h3.2v13h-3.2z" class="fi"/></svg>
        </button>
        <button class="pb" id="nx"><svg viewBox="0 0 24 24"><path d="M7 5v14l9-7z" class="fi"/><path d="M18 5v14" stroke-linecap="round"/></svg></button>
      </div>
      <span class="vol"><button class="pill" id="vv" title="静音"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" class="fi"/><path d="M15.5 8.5a5 5 0 0 1 0 7" id="vw1"/></svg></button><span class="vrail" id="vrail"><span class="vr"></span><i id="vfill"></i><b id="vknob"></b></span></span>
      <span class="tm r" id="t2">0:00</span>
    </div>
  </div>
  <div class="lyr" id="lyr">
    <div class="lh"><b id="ltitle">歌词</b><button class="lc" id="lx"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="lsc" id="lsc"></div>
    <div class="lhint" id="lhint">暂无歌词</div>
  </div>
  <div class="tst" id="tst"></div>
</div>
<script>
/* ================= 工具 ================= */
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var fmt=function(ms){ms=Math.max(0,ms|0);var s=(ms/1000)|0;return ((s/60)|0)+":"+("0"+(s%60)).slice(-2)};
var noteT=null;
function note(m){var t=$("tst");t.textContent=m;t.classList.add("on");clearTimeout(noteT);noteT=setTimeout(function(){t.classList.remove("on")},2200)}
function api(p,d){return chushi.ne.api(p,d).then(function(r){if(!r.ok)throw new Error(r.err||"接口失败");return r.data})}
function au(a,o){return chushi.ne.audio(a,o).then(function(r){if(!r.ok)throw new Error(r.err||"操作失败");return r.data})}
/* ================= 状态 =================
   gen=视图世代令牌（异步回包对账：慢接口迟到回包不再渲染进已切走的视图）
   curRow=当前播放曲行引用（音质热切换直取，不依赖列表下标）
   anc=rAF 插值锚点（音频帧≈4Hz 为真值，歌词引擎帧间按播放态外推） */
var S={tab:"d",rows:[],pls:null,q:-1,mode:0,ly:null,lyOn:false,lastSeq:0,curLy:-2,
  logged:false,uid:null,qrKey:"",pollT:null,drag:false,vol:.7,lastVol:.7,dur:0,lvl:"standard",
  anc:{posMs:0,playing:false,at:0},lyEls:[],lyTarget:null,lyScrollUntil:0,lyScrollIdx:-1,
  lyRaf:0,lyPaused:null,gen:0,curRow:null};
function norm(o){return{id:o.id,name:o.name||"",
  ar:(o.ar||o.artists||[]).map(function(a){return a.name||""}).join(" / "),
  al:(o.al||o.album||{}).name||"",
  dt:o.dt||o.duration||0,fee:o.fee||0}}
/* ================= 音频状态帧 ================= */
function onAudio(s){
  if(!s||s.seq<=S.lastSeq)return;S.lastSeq=s.seq;S.dur=s.duration||0;
  S.anc.posMs=(s.position||0)*1000;S.anc.playing=!!s.playing;S.anc.at=Date.now();
  $("fill").style.width=(s.duration?Math.min(100,s.position/s.duration*100):0)+"%";
  $("t1").textContent=fmt(s.position*1000);
  $("t2").textContent="-"+fmt((s.duration-s.position)*1000);
  $("icPlay").classList[s.playing?"add":"remove"]("off");
  $("icPause").classList[s.playing?"remove":"add"]("off");
  if(s.name){$("tt").textContent=s.name;$("ar").textContent=s.artist||"";
    $("tri").style.display=s.trial?"":"none"}
  /* 封面存活：守卫只跳过冗余 src 写（同曲切音质时 src 不变），.on 态无条件
     补回——否则热切换摘下后 add("on") 永不再执行=封面恒隐；空 cover 不动作 */
  if(s.cover){var cv=$("cov");if(cv.getAttribute("src")!==s.cover)cv.setAttribute("src",s.cover);
    cv.classList.add("on")}
  if(typeof s.volume==="number"&&Math.abs(s.volume-S.vol)>.004){S.vol=s.volume;volUI()}
  if(s.ended)next();
  if(s.sysCmd==="next")next();
  if(s.sysCmd==="prev")prev();
}
chushi.ne.sub(onAudio);
/* ================= 播放链 ================= */
function play(list,i,keep){
  if(!list||!list[i])return;S.rows=list;S.q=i;playRow(list[i],keep);
}
/* playRow：单曲执行体（列表点击/音质热切换共用，热切换直执 S.curRow 行引用） */
function playRow(r,keep){
  if(!r)return;S.curRow=r;mark();
  api("/weapi/song/enhance/player/url/v1",{ids:"["+r.id+"]",level:S.lvl,encodeType:"flac"})
  .then(function(d){var x=(d.data||[])[0];
    if(!x||!x.url){note((r.fee===1?"VIP 歌曲":r.name)+" 暂无法播放（版权或登录限制）");return}
    /* 账号权限自动降级提示：响应 level 与请求不符即提示（服务端回退较低音质，url 仍可播） */
    if(x.level&&x.level!==S.lvl&&S.lvl!=="standard"){
      var LN={standard:"标准",higher:"较高",exhigh:"极高",lossless:"无损",hires:"Hi-Res",jymaster:"超清母带"};
      note("账号无此音质权限，已回退 "+(LN[x.level]||x.level))}
    $("tt").textContent=r.name;$("ar").textContent=r.ar;$("cov").classList.remove("on");
    $("bar").classList.add("on");
    au("load",{url:x.url.replace(/^http:/,"https:"),
      meta:{id:String(r.id),name:r.name,artist:r.ar,album:r.al,cover:"",trial:!!x.freeTrialInfo}})
    .then(function(){
      /* 音质热切换：load 后 seek 回原进度（CDN Range 支持） */
      if(keep>0&&isFinite(keep))au("seek",{position:keep}).catch(function(){});
      getPic(r);getLyric(r.id)})
    .catch(function(e){note("播放失败："+e.message)});
  }).catch(function(e){note(e.message)});
}
function getPic(r){
  api("/weapi/v3/song/detail",{c:'[{"id":'+r.id+"}]",ids:"["+r.id+"]"})
  .then(function(d){var s=(d.songs||[])[0],p=s&&s.al&&s.al.picUrl;
    if(p)au("meta",{meta:{cover:String(p).replace(/^http:/,"https:")}}).catch(function(){});
  }).catch(function(){});
}
function next(){if(!S.rows.length)return;var n=S.q+1;
  if(S.mode===1)n=S.q;
  else if(S.mode===2&&S.rows.length>1){do{n=(Math.random()*S.rows.length)|0}while(n===S.q)}
  else if(n>=S.rows.length)n=0;
  play(S.rows,n)}
function prev(){if(!S.rows.length)return;var n=S.q-1;if(n<0)n=S.rows.length-1;play(S.rows,n)}
/* 高亮只有确认 DOM 行与当前曲同一首才落（换视图后 S.q 残留防误亮） */
function mark(){
  var old=document.querySelector(".row.cur");if(old)old.classList.remove("cur");
  if(!S.curRow||!S.rows||!S.rows[S.q]||String(S.rows[S.q].id)!==String(S.curRow.id))return;
  var el=document.querySelector('.row[data-i="'+S.q+'"]');if(el)el.classList.add("cur")}
/* ================= 列表渲染 ================= */
function emp(t){var l=$("list");l.style.display="";$("qrbox").classList.remove("on");
  /* 自重建式空态：rows() 重写 innerHTML 会销毁旧 .emp 节点，每次重建防 null */
  l.innerHTML='<div class="emp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 17V8l7-1.5V15"/><circle cx="8.5" cy="17" r="1.6"/><circle cx="15.5" cy="15" r="1.6"/></svg><span>'+esc(t)+"</span></div>";
  l.classList.add("empty")}
function rows(list,hint){
  S.rows=list;$("list").style.display="";$("qrbox").classList.remove("on");
  $("list").classList.remove("pgrid");
  var h=hint||"";
  list.forEach(function(r,i){
    h+='<div class="row" data-i="'+i+'"><div class="ri"><div class="rt">'+esc(r.name)+
      '</div><div class="ra">'+esc(r.ar)+(r.al?" · "+esc(r.al):"")+"</div></div>"+
      (r.fee===1||r.fee===8?'<span class="vip">VIP</span>':r.fee===4?'<span class="vip">专</span>':"")+
      '<div class="rd">'+fmt(r.dt)+"</div></div>";
  });
  $("list").innerHTML=h;$("list").classList.toggle("empty",!list.length);
  if(!list.length)emp("没有内容");
}
/* ================= 视图切换 =================
   页签只有 每日推荐/我的歌单 两枚；搜索视图由顶部命令行唤起（S.tab="s"，
   两枚页签同时熄灭）。世代令牌在每次切视图自增，所有异步回包携出发时世代
   对账、过期即弃——慢接口迟到回包不再渲染进已切走的视图。 */
function segLite(){var bs=$("tabs").querySelectorAll("b");
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].getAttribute("data-t")===S.tab)}
function tab(t){
  S.tab=t;S.gen++;stopPoll();qpopSet(false);segLite();
  $("list").style.display="";$("qrbox").classList.remove("on");
  $("list").classList.remove("pgrid");
  if(t==="d")loadDaily();else loadPl();
}
$("tabs").addEventListener("click",function(e){
  var b=e.target&&e.target.closest?e.target.closest("b"):null;
  if(b)tab(b.getAttribute("data-t"));
});
function loadDaily(){
  var g=S.gen;emp("加载每日推荐…");
  api("/weapi/v3/discovery/recommend/songs",{}).then(function(d){
    if(g!==S.gen)return;
    var ds=((d.data||{}).dailySongs||[]).map(norm),t=new Date();
    rows(ds,'<div class="subh">每日推荐 · '+(t.getMonth()+1)+"月"+t.getDate()+"日 · 免登录可播免费歌</div>");
  }).catch(function(e){if(g!==S.gen)return;emp("加载失败");note(e.message)});
}
function loadPl(){
  if(!S.logged){qrView();return}
  if(S.pls){plCards();return}
  var g=S.gen;emp("加载歌单…");
  api("/weapi/user/playlist",{uid:String(S.uid),limit:"30",offset:"0",includeVideo:"true"})
  .then(function(d){if(g!==S.gen)return;S.pls=d.playlist||[];plCards()})
  .catch(function(e){if(g!==S.gen)return;emp("加载失败");note(e.message)});
}
function plCards(){
  var h='<div class="subh">我的歌单 · '+(S.pls||[]).length+" 个</div>";
  (S.pls||[]).forEach(function(p,i){
    h+='<div class="plc" data-p="'+i+'"><span class="pli"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h9"/><circle cx="17.5" cy="17" r="2.5"/></svg></span>'+
      '<div class="ri"><div class="pn">'+esc(p.name)+'</div><div class="pc">'+p.trackCount+" 首</div></div></div>";
  });
  S.rows=[];
  $("list").style.display="";$("qrbox").classList.remove("on");
  $("list").classList.remove("empty");
  if((S.pls||[]).length){$("list").classList.add("pgrid");$("list").innerHTML=h}
  else emp("歌单是空的");
}
/* 列表统一事件委托：曲目行起播 / 歌单卡片两级打开 / 返回锚 */
$("list").addEventListener("click",function(e){
  var root=e.target&&e.target.closest?e.target:null;if(!root)return;
  if(root.closest(".bk")){plCards();return}
  var card=root.closest(".plc");
  if(card){
    var p=(S.pls||[])[+card.getAttribute("data-p")];if(!p)return;
    var g=S.gen;emp("打开歌单…");
    api("/weapi/v6/playlist/detail",{id:String(p.id),n:"1000",s:"8"})
    .then(function(d){
      if(g!==S.gen)return;
      var ts=((d.playlist||{}).tracks||[]).map(norm);
      rows(ts,'<div class="subh"><button class="bk">‹ 歌单列表</button><span>'+esc(p.name)+" · "+ts.length+" 首</span></div>");
    }).catch(function(er){if(g!==S.gen)return;emp("加载失败");note(er.message)});
    return}
  var row=root.closest(".row");
  if(row)play(S.rows,+row.getAttribute("data-i"));
});
/* ================= 搜索（顶部命令行：唯一搜索入口） =================
   双对账：①世代令牌——切走视图后迟到回包即弃；②关键词——连发搜索时
   慢者不覆盖快者。搜索视图不占页签：S.tab="s" 时两枚页签同时熄灭。 */
function doSearch(){
  var k=$("q").value.trim();if(!k){note("先输入点关键词");return}
  var g=++S.gen;S.tab="s";stopPoll();qpopSet(false);segLite();
  $("list").style.display="";$("qrbox").classList.remove("on");
  $("list").classList.remove("pgrid");
  emp("搜索「"+k+"」…");
  api("/weapi/search/get",{s:k,type:"1",limit:"30",offset:"0"})
  .then(function(d){
    if(g!==S.gen||k!==$("q").value.trim())return;
    var ds=((d.result||{}).songs||[]).map(norm);
    rows(ds,'<div class="subh">搜索「'+esc(k)+"」 · "+ds.length+" 首</div>");
  })
  .catch(function(e){if(g!==S.gen)return;emp("搜索失败");note(e.message)});
}
$("go").addEventListener("click",doSearch);
$("q").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
/* ================= 音质三选一小弹窗 ================= */
var LVLS=[["standard","标准"],["exhigh","极高"],["lossless","无损"]],
    QNAMES={standard:"标准",exhigh:"极高",lossless:"无损"},qpopOn=false;
function qLabel(){
  var qi=-1,i;
  for(i=0;i<LVLS.length;i++)if(LVLS[i][0]===S.lvl)qi=i;
  $("sq").textContent=qi>=0?LVLS[qi][1]:"标准";
  var bs=$("qpop").querySelectorAll("button[data-q]");
  for(i=0;i<bs.length;i++)bs[i].classList.toggle("cur",bs[i].getAttribute("data-q")===S.lvl)}
function qpopSet(on){if(on===qpopOn)return;qpopOn=on;$("qpop").classList[on?"add":"remove"]("on")}
$("sq").addEventListener("click",function(){qpopSet(!qpopOn)});
$("qpop").addEventListener("click",function(e){
  var b=e.target&&e.target.closest?e.target.closest("button[data-q]"):null;if(!b)return;
  applyLvl(b.getAttribute("data-q"))});
document.addEventListener("click",function(e){
  if(qpopOn&&!(e.target&&e.target.closest&&e.target.closest(".sqw")))qpopSet(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&qpopOn)qpopSet(false)});
function applyLvl(lv){
  qpopSet(false);if(!QNAMES[lv]||S.lvl===lv)return;
  S.lvl=lv;qLabel();
  if(chushi.storage)chushi.storage.set("qLevel",S.lvl).catch(function(){});
  /* 播放中热切换：S.curRow 直取当前曲+seek 保进度；未播放仅记忆与换标 */
  if(S.lastSeq&&S.curRow){
    playRow(S.curRow,S.anc.playing?S.anc.posMs/1000:0);
    note("音质："+QNAMES[lv])}
}
if(chushi.storage)chushi.storage.get("qLevel").then(function(v){
  if(QNAMES[v]){S.lvl=v;qLabel()}
}).catch(function(){});
/* ================= 登录态 ================= */
function chipUI(){var c=$("chip");
  c.textContent=S.logged?"已登录":"未登录";
  c.classList[S.logged?"add":"remove"]("ok");c.classList.remove("warn")}
function who(){
  api("/weapi/w/nuser/account/get",{}).then(function(d){
    var a=d.account&&d.account.id;
    S.logged=!!a;S.uid=a||null;chipUI();
  }).catch(function(){chipUI()});
}
/* 退出登录：chip 两步确认（3s 回弹）；/weapi/logout 服务端 Set-Cookie 清
   MUSIC_U → cookie jar 即登录态；未登录点击=引导去扫码 */
var loArm=null;
$("chip").addEventListener("click",function(){
  if(!S.logged){tab("p");return}
  if(loArm){clearTimeout(loArm);loArm=null;$("chip").textContent="退出中";
    api("/weapi/logout",{}).then(function(){
      S.logged=false;S.uid=null;S.pls=null;S.qrKey="";stopPoll();
      chipUI();note("已退出登录");if(S.tab==="p")qrView();
    }).catch(function(e){chipUI();note("退出失败："+e.message)});
    return}
  $("chip").textContent="确认退出?";$("chip").classList.add("warn");
  loArm=setTimeout(function(){loArm=null;chipUI()},3000);
});
/* ================= 扫码登录（QR：byte 模式 · ECC L · v1-5 单块 · 掩码2） ================= */
function qrView(){
  $("list").style.display="none";$("qrbox").classList.add("on");
  $("qst").textContent=S.qrKey?"待扫码":"生成二维码…";
  if(!S.qrKey)qrInit();
}
function qrInit(){
  stopPoll();$("qst").textContent="生成二维码…";$("qr").style.opacity=".35";
  api("/weapi/login/qrcode/unikey",{type:"1"}).then(function(d){
    if(!d.unikey)throw new Error("unikey 为空");
    S.qrKey=d.unikey;
    if(!drawQR($("qr"),"https"+"://music.163.com/login?codekey="+d.unikey))return;
    $("qr").style.opacity="";$("qst").textContent="待扫码";
    S.pollT=setInterval(pollQr,2500);
  }).catch(function(){$("qr").style.opacity="";$("qst").textContent="生成失败，点二维码重试";S.qrKey="";});
}
function pollQr(){
  api("/weapi/login/qrcode/client/login",{key:S.qrKey,type:"1"}).then(function(d){
    if(d.code===802)$("qst").textContent="已扫描，请在手机确认";
    else if(d.code===803){stopPoll();S.qrKey="";note("登录成功");who()}
    else if(d.code===800){S.qrKey="";qrInit()}
  }).catch(function(){});
}
function stopPoll(){if(S.pollT){clearInterval(S.pollT);S.pollT=null}}
$("qr").addEventListener("click",function(){S.qrKey="";qrInit()});
/* QR 矩阵编码：模式4(byte)+长度+数据 → 补齐符 → RS 纠错（GF(256)，0x11d）
   → finder/alignment/timing/format(BCH 15,5)/dark module → 之字放置+掩码2 */
function qrMatrix(text){
  var oct=[],str=unescape(encodeURIComponent(text)),i,j,k;
  for(i=0;i<str.length;i++)oct.push(str.charCodeAt(i));
  var CAP=[17,32,53,78,106],DCW=[19,34,55,80,108],ECW=[7,10,15,20,26],DIM=[21,25,29,33,37],v=0;
  while(v<4&&oct.length>CAP[v])v++;
  if(oct.length>CAP[4])return null;
  var size=DIM[v],nd=DCW[v],ne=ECW[v];
  var EXP=[],LOG=[];
  (function(){var x=1;for(i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=285}
    for(i=255;i<512;i++)EXP[i]=EXP[i-255]})();
  function gmul(a,b){return(a===0||b===0)?0:EXP[LOG[a]+LOG[b]]}
  var flow=[];
  function put(val,len){for(k=len-1;k>=0;k--)flow.push((val>>>k)&1)}
  put(4,4);put(oct.length,8);
  for(i=0;i<oct.length;i++)put(oct[i],8);
  var head=Math.min(nd,Math.ceil(flow.length/8)),cw=[];
  for(i=0;i<head;i++){var byte=0;for(j=0;j<8;j++)byte=(byte<<1)|(flow[i*8+j]||0);cw.push(byte)}
  for(i=head;i<nd;i++)cw.push((i-head)%2?17:236);
  var gen=new Array(ne+1).fill(0);gen[0]=1;
  for(i=0;i<ne;i++){
    var nxt=new Array(ne+1).fill(0);
    for(j=0;j<=i;j++){nxt[j]^=gmul(gen[j],EXP[i]);nxt[j+1]^=gen[j]}
    gen=nxt;
  }
  var work=cw.slice();
  for(i=0;i<ne;i++)work.push(0);
  for(i=0;i<nd;i++){
    var f=work[i];if(f===0)continue;
    for(j=0;j<=ne;j++)work[i+j]^=gmul(gen[ne-j],f);
  }
  var all=cw.concat(work.slice(nd)),bits=[];
  for(i=0;i<all.length;i++)for(j=7;j>=0;j--)bits.push((all[i]>>j)&1);
  var grid=[];
  for(i=0;i<size;i++){grid.push(new Array(size));for(j=0;j<size;j++)grid[i][j]=null}
  function finder(r0,c0){var dy,dx;
    for(dy=-1;dy<=7;dy++)for(dx=-1;dx<=7;dx++){
      var rr=r0+dy,cc=c0+dx;if(rr<0||cc<0||rr>=size||cc>=size)continue;
      var on=(dy>=0&&dy<=6&&(dx===0||dx===6))||(dx>=0&&dx<=6&&(dy===0||dy===6))||
        (dy>=2&&dy<=4&&dx>=2&&dx<=4);

  for(i=8;i<size-8;i++){grid[6][i]=grid[i][6]=i%2===0?1:0}
  if(size>21){var a=size-7;
    for(var ay=-2;ay<=2;ay++)for(var ax=-2;ax<=2;ax++){

     两份拷贝（左上围栏 + 右上横排/左下竖排） */
  var fd=(1<<3)|2,f3=fd<<10;

  for(i=9;i<15;i++)grid[8][14-i]=(fb>>i)&1;

  var col=size-1,up=true,idx=0;

      var r2=up?size-1-k:k;
      for(var cx=0;cx<2;cx++){
        var c2=col-cx;
        if(r2<0||r2>=size||c2<0||c2>=size||grid[r2][c2]!==null)continue;
        var bit=idx<bits.length?bits[idx++]:0;
        if(c2%3===0)bit^=1;

function drawQR(cv,text){

  var n=m.length,ctx=cv.getContext("2d"),W=cv.width,sc=W/(n+16);
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,W);
  ctx.fillStyle="#18181b";
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(m[r][c]===1)
    ctx.fillRect((c+8)*sc,(r+8)*sc,Math.ceil(sc),Math.ceil(sc));
  return true;
}
/* ================= 歌词解析 ================= */
function parseLrc(t){var m=[];(t||"").replace(/\r/g,"").split("\n").forEach(function(l){
  var ts=l.match(/\[\d+:\d+(\.\d+)?\]/g);if(!ts)return;
  var x=l.replace(/\[[^\]]*\]/g,"").trim();if(!x)return;
  ts.forEach(function(t0){var p=t0.slice(1,-1).split(":");m.push({t:((+p[0]*60+ +p[1])*1000)|0,x:x})})});
  m.sort(function(a,b){return a.t-b.t});return m}
function parseTly(t){var m={};(t||"").replace(/\r/g,"").split("\n").forEach(function(l){
  var ts=l.match(/^\[(\d+:\d+(\.\d+)?)\]/);if(!ts)return;
  var x=l.replace(/\[[^\]]*\]/g,"").trim();if(!x)return;
  var p=ts[1].split(":");m[Math.round((+p[0]*60+ +p[1])*1000)]=x});return m}
/* YRC 词时间是全曲绝对毫秒（ext-lyric 同数据解析正常为铁证）——行头 st 与
   词时间同一坐标系，禁止二次叠加（旧 st+w[1] 双叠=扫光整体错位根因） */
function parseYrc(t){var m=[];(t||"").split("\n").forEach(function(l){
  if(l.charAt(0)!=="[")return;var h=l.match(/^\[(\d+),(\d+)\](.*)$/);if(!h)return;
  var ws=[],w,re=/\((\d+),(\d+),\d+\)([^(]*)/g;
  while((w=re.exec(h[3])))if(w[3])ws.push({t:+w[1],d:+w[2],x:w[3]});
  if(ws.length)m.push({t:+h[1],w:ws})});return m}

function lyRestore(i){

function lyReconcile(act,ref){

    if(on){S.lyEls[i].sung=true;S.lyEls[i].clean=false;continue}
    if(done){
      if(!was){
        if(S.lyEls[i].sung){lyFinalize(i);S.lyEls[i].clean=true}

function lyScroll(idx,track){

function lyFrame(){
  if(!S.lyOn){S.lyRaf=0;return}
  if(!S.ly||!S.lyEls||!S.lyEls.length){S.lyRaf=requestAnimationFrame(lyFrame);return}
  var posMs=S.anc.posMs+(S.anc.playing?Date.now()-S.anc.at:0);
  var src=S.ly.y&&S.ly.y.length?S.ly.y:S.ly.l,ci=-1,i;

  /* 逐帧只写当前行词（其余行离场时一次性定稿）；间奏驻留不写=扫光挂 100% */
  if(S.ly.y&&S.ly.y.length&&ci>=0&&S.lyEls[ci]){
    var es=S.lyEls[ci],words=S.ly.y[ci].w;
