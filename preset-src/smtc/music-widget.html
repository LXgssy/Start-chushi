<style>
  :root{color-scheme:light dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;
    --ink:#27272a;--ink2:#71717a;--ink3:#a1a1aa;--line:rgba(0,0,0,.08);
    --pr:rgba(0,0,0,.10);--ok:#34d399;--card:rgba(255,255,255,.86);--card2:rgba(255,255,255,.55);
    --acc:var(--w-accent,#8b5cf6);
    --acc20:color-mix(in oklab,var(--acc) 20%,transparent);
    --acc32:color-mix(in oklab,var(--acc) 32%,transparent);
    --acc66:color-mix(in oklab,var(--acc) 66%,transparent);
    --ez:var(--ez);--r9:999px;
  }
  [data-theme=dark] body{
    --ink:#f4f4f5;--ink2:#a1a1aa;--ink3:#71717a;--line:rgba(255,255,255,.09);
    --pr:rgba(255,255,255,.12);--card:rgba(24,24,28,.88);--card2:rgba(39,39,44,.55);
  }
  .card{position:relative;width:100%;height:100%;background:var(--card);
    backdrop-filter:blur(22px) saturate(1.5);
    border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:0 10px 34px rgba(0,0,0,.13),0 1px 0 rgba(255,255,255,.14) inset;
    }
  /* ---------- 紧凑条 ---------- */
  .cp{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 10px;
    transition:opacity .25s ease .12s}
  .mode-fl .cp{opacity:0;pointer-events:none;transition:opacity .25s ease}
  .ar,.he{position:relative;overflow:hidden}
  .ar{width:44px;height:44px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--acc32),var(--acc20));box-shadow:0 2px 8px rgba(0,0,0,.16)}
  .pl .ar{animation:br 3.6s ease-in-out infinite}
  @keyframes br{50%{box-shadow:0 2px 10px rgba(0,0,0,.18),0 0 0 5px var(--acc20)}}
  .ar img,.he img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
    transition:opacity .6s var(--ez),filter .5s ease}
  .ar img.on,.he img.on{opacity:1}
  .pz{filter:saturate(.55) brightness(.9)}
  .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .t1{font-size:13px;font-weight:550;color:var(--ink);line-height:1.25;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .t2{font-size:11px;color:var(--ink2);line-height:1.2;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .sw{animation:ri .5s var(--ez)}
  @keyframes ri{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  /* ---------- 按钮 ---------- */
  .bt{appearance:none;border:0;background:transparent;color:var(--ink2);width:34px;height:34px;
    border-radius:var(--r9);flex:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .25s var(--ez)}
  .bt svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round}
  .bt svg.pc{fill:currentColor;stroke:none}
  .bt:hover{background:var(--card2);color:var(--ink);transform:scale(1.06)}
  .bt.mi{width:38px;height:38px;color:var(--ink);background:var(--card2)}
  .bt.mi:hover{background:var(--acc20);color:var(--acc)}
  .cx{position:absolute;right:10px;top:10px;appearance:none;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:var(--r9);color:#fff;background:rgba(0,0,0,.28);opacity:.8;
    transition:transform .35s var(--ez)}
  .cx svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .cx:hover{transform:scale(1.08)}
  .ic{stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  /* ---------- 展开卡：dock 面板复刻 ---------- */
  .fl{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 16px 11px;
    opacity:0;pointer-events:none;transition:opacity .32s ease}
  .mode-fl .fl{opacity:1;pointer-events:auto}
  .rw{display:flex;align-items:center;gap:14px}
  .cw{position:relative;flex:none}
  .glow{position:absolute;inset:-7px;border-radius:22px;background:var(--acc);opacity:0;
    filter:blur(12px);transition:opacity .55s ease}
  .pl .glow{opacity:.24}
  .he{width:96px;height:96px;border-radius:16px;
    background:linear-gradient(135deg,var(--acc32),var(--acc20));
    box-shadow:0 4px 14px rgba(0,0,0,.16);transition:transform .5s var(--ez)}
  .pl .he{transform:scale(1.02)}
  .dot{position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:var(--r9);
    background:var(--ok);box-shadow:0 0 6px var(--ok);opacity:0;transition:opacity .4s}
  .pl .dot{opacity:1}
  .info{flex:1;min-width:0;padding-right:24px}
  .info .t1{font-size:15px;font-weight:560;line-height:1.3}
  .info .t2{font-size:12px;color:var(--ink2);margin-top:3px}
  .info .t3{font-size:11px;color:var(--ink3);margin-top:2px}
  .sk{margin-top:13px;height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  .rl{position:relative;width:100%;height:4px;border-radius:4px;background:var(--pr)}
  .rl i{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:4px;background:var(--acc)}
  .rl u{position:absolute;top:50%;width:10px;height:10px;border-radius:var(--r9);background:#fff;
    border:2px solid var(--acc);transform:translate(-50%,-50%);pointer-events:none}
  .tm{display:flex;justify-content:space-between;margin-top:2px;font-size:10.5px;
    color:var(--ink3);font-variant-numeric:tabular-nums}
  .ct{flex:1;display:flex;align-items:center;justify-content:center;gap:20px}
  .ct .bt{width:38px;height:38px}
  .ct .bt svg{width:19px;height:19px}
  .ct .bt.mi{width:46px;height:46px;color:#fff;background:var(--acc);
    box-shadow:0 4px 14px var(--acc32),0 1px 0 rgba(255,255,255,.22) inset}
  .ct .bt.mi svg{width:20px;height:20px}
  .ct .bt.mi:active{transform:scale(.94)}
  .ft{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3)}
  .dt{width:6px;height:6px;border-radius:var(--r9);background:var(--ok);flex:none;transition:background .3s}
  .dt.pz{background:#fbbf24}
  /* ---------- 空态 ---------- */
  .em{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:7px;text-align:center;padding:12px}
  .em .ic{color:var(--acc66)}
  .em .e1{font-size:12.5px;font-weight:550;color:var(--ink)}
  .em .e2{font-size:11px;color:var(--ink3);line-height:1.5;max-width:250px}
  .hd{display:none!important}
</style>

<svg width="0" height="0"><defs>
  <polygon id="i-pl" points="7 4 19 12 7 20 7 4"/>
  <g id="i-pa"><rect x="6.6" y="4.6" width="3.6" height="14.8" rx="1.3"/><rect x="13.8" y="4.6" width="3.6" height="14.8" rx="1.3"/></g>
  <g id="i-pv"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></g>
  <g id="i-nx"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></g>
  <polyline id="i-up" points="6 15 12 9 18 15"/>
</defs></svg>

<div class="card mode-em" id="card">
  <div class="cp" id="cp">
    <div class="ar"><img id="aS" alt=""></div>
    <div class="mt">
      <div class="t1" id="t1s">—</div>
      <div class="t2" id="t2s">正在等待媒体</div>
    </div>
    <button class="bt mi" id="pS0" aria-label="播放或暂停">
      <svg id="yS" viewBox="0 0 24 24"><use href="#i-pl"/></svg>
      <svg id="nS" viewBox="0 0 24 24" class="hd pc"><use href="#i-pa"/></svg>
    </button>
  </div>

  <div class="fl" id="fl">
    <div class="rw">
      <div class="cw">
        <div class="glow"></div>
        <div class="he"><img id="aF" alt=""><span class="dot" id="dot"></span></div>
      </div>
      <div class="info">
        <div class="t1" id="t1f">—</div>
        <div class="t2" id="t2f"></div>
        <div class="t3" id="t3f"></div>
      </div>
    </div>
    <button class="cx" id="cxB" aria-label="收起"><svg viewBox="0 0 24 24"><use href="#i-up"/></svg></button>
    <div class="sk" id="sk"><div class="rl"><i id="barF"></i><u id="th"></u></div></div>
    <div class="tm"><span id="tC">0:00</span><span id="tD">0:00</span></div>
    <div class="ct">
      <button class="bt" id="pv" aria-label="上一首"><svg viewBox="0 0 24 24"><use href="#i-pv"/></svg></button>
      <button class="bt mi" id="pF0" aria-label="播放或暂停">
        <svg id="yF" viewBox="0 0 24 24"><use href="#i-pl"/></svg>
        <svg id="nF" viewBox="0 0 24 24" class="hd pc"><use href="#i-pa"/></svg>
      </button>
      <button class="bt" id="nx" aria-label="下一首"><svg viewBox="0 0 24 24"><use href="#i-nx"/></svg></button>
    </div>
    <div class="ft"><span class="dt" id="dt"></span><span id="ap">已连接</span></div>
  </div>

  <div class="em" id="em">
    <svg class="ic" width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/></svg>
    <div class="e1" id="e1">系统媒体待接入</div>
    <div class="e2" id="e2">启动初始SMTC桥后接入</div>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var card=$("card"),cp=$("cp"),sk=$("sk");
var E={aS:$("aS"),t1s:$("t1s"),t2s:$("t2s"),yS:$("yS"),nS:$("nS"),
  aF:$("aF"),t1f:$("t1f"),t2f:$("t2f"),t3f:$("t3f"),yF:$("yF"),nF:$("nF"),
  barF:$("barF"),th:$("th"),tC:$("tC"),tD:$("tD"),ap:$("ap"),dt:$("dt"),
  e1:$("e1"),e2:$("e2")};
var H={cp:64,fl:248,em:92},mode="em",st=null,lastKey="",drag=false,dragRatio=0;
var ctl=function(c,p){try{return chushi.smtc.control(c,p)}catch(e){return Promise.resolve(false)}};
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+(s%60<10?"0":"")+s%60}
function posNow(){
  if(!st||!st.track)return 0;
  var t=st.track,r=t.rate>0?t.rate:1;
  var p=t.position+(t.playing?(Date.now()-t.fetchedAt)/1000*r:0);
  return t.duration>0?Math.min(t.duration,Math.max(0,p)):Math.max(0,p);
}
function setMode(m){
  mode=m;card.className="card mode-"+m;
  $("em").classList.toggle("hd",m!=="em");
  try{chushi.resize(340,H[m])}catch(e){}
}
function playIcons(on){
  E.yS.classList.toggle("hd",on);E.nS.classList.toggle("hd",!on);
  E.yF.classList.toggle("hd",on);E.nF.classList.toggle("hd",!on);
  E.dt.classList.toggle("pz",!on);card.classList.toggle("pl",on);
  E.aS.classList.toggle("pz",!on);E.aF.classList.toggle("pz",!on);
}
/* 封面：有则显示，无则落到包内默认唱片（asset:cover.svg，.cshz 导入时内联） */
var DEF="asset:cover.svg";
function cover(img,u){
  var s=u||DEF;
  if(img.__s!==s){img.src=s;img.__s=s}
  img.classList.add("on");
}
function txt(el,v){if(el.textContent!==v)el.textContent=v}
function render(){
  var s=st,t=s&&s.track;
  if(!s||!s.connected||!t){
    txt(E.e1,s&&s.connected?"等待媒体会话":"系统媒体待接入");
    txt(E.e2,s&&s.connected?"在网易云等播放器放首歌即会亮起":"启动初始SMTC桥后接入");
    txt(E.t1s,s&&s.connected?"等待媒体会话":"未连接 SMTC 桥");
    txt(E.t2s,s&&s.connected?"在任意播放器放首歌":"启动本地桥后自动接入");
    if(mode!=="em")setMode("em");
    return;
  }
  var key=[t.title,t.artist,t.album,t.app].join("|");
  if(key!==lastKey){
    lastKey=key;
    var els=[E.t1s,E.t2s,E.t1f,E.t2f,E.t3f];
    for(var i=0;i<els.length;i++){els[i].classList.remove("sw");void els[i].offsetWidth;els[i].classList.add("sw")}
  }
  txt(E.t1s,t.title||"未知曲目");
  txt(E.t2s,t.artist||"未知艺术家");
  txt(E.t1f,t.title||"未知曲目");
  txt(E.t2f,t.artist||"未知艺术家");
  txt(E.t3f,t.album||"");
  txt(E.ap,"已连接 · "+(t.app||"系统媒体"));
  if(mode==="em")setMode("cp");/* 先切模式：setMode 整写 className，须在 pl 类之前 */
  cover(E.aS,st.cover);cover(E.aF,st.cover);
  playIcons(t.playing);
}
/* 进度插值：rAF 逐帧（拖动时以预览为准） */
function tick(){
  if(st&&st.track&&mode!=="em"){
    var t=st.track,p=drag?dragRatio*t.duration:posNow();
    var r=t.duration>0?Math.min(1,Math.max(0,p/t.duration)):0;
    var w=(r*100).toFixed(2)+"%";
    E.barF.style.width=w;E.th.style.left=w;
    txt(E.tC,fmt(p));txt(E.tD,t.duration>0?fmt(t.duration):"--:--");
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
/* 控制 */
$("pS0").addEventListener("click",function(e){e.stopPropagation();ctl("toggle")});
$("pF0").addEventListener("click",function(){ctl("toggle")});
$("nx").addEventListener("click",function(){ctl("next")});
$("pv").addEventListener("click",function(){ctl("prev")});
/* 展开 / 收起：点紧凑条任意处展开（按钮除外） */
function open(){setMode("fl")}
cp.addEventListener("click",function(e){if(!e.target.closest(".bt"))open()});
$("cxB").addEventListener("click",function(){setMode("cp")});
/* seek：按住拖动，松手提交 */
function ratio(e){
  var r=sk.getBoundingClientRect();
  return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
}
sk.addEventListener("pointerdown",function(e){
  if(!st||!st.track||!(st.track.duration>0))return;
  drag=true;sk.classList.add("dr");dragRatio=ratio(e);
  sk.setPointerCapture(e.pointerId);
});
sk.addEventListener("pointermove",function(e){if(drag)dragRatio=ratio(e)});
sk.addEventListener("pointerup",function(){
  if(!drag)return;drag=false;sk.classList.remove("dr");
  var t=st&&st.track;
  if(t&&t.duration>0)ctl("seek",dragRatio*t.duration);
});
/* 订阅 SMTC 快照（订阅即回推）+ 兜底 get 一次 */
try{chushi.smtc.subscribe(function(s){st=s;render()})}catch(e){}
try{chushi.smtc.get().then(function(s){if(!st){st=s;render()}})}catch(e){}
setMode("em");
})();
</script>
