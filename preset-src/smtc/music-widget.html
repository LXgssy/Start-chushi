<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChuShi Music</title>
<style>
:root{color-scheme:light dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{
  font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  user-select:none;
  --ink:#27272a;--ink2:#71717a;--ink3:#a1a1aa;--line:rgba(0,0,0,.08);
  --pr:rgba(0,0,0,.10);--ok:#34d399;--card:rgba(255,255,255,.86);--card2:rgba(255,255,255,.55);
  --acc:var(--w-accent,#8b5cf6);
  --acc20:color-mix(in oklab,var(--acc) 20%,transparent);
  --acc32:color-mix(in oklab,var(--acc) 32%,transparent);
  --acc66:color-mix(in oklab,var(--acc) 66%,transparent);
  /* 「初始」内建同款真实缓动（跨 iframe 拿不到宿主变量，给真值） */
  --ez:cubic-bezier(.22,1,.36,1);--r9:999px;
}
[data-theme=dark] body{
  --ink:#f4f4f5;--ink2:#a1a1aa;--ink3:#71717a;--line:rgba(255,255,255,.09);
  --pr:rgba(255,255,255,.12);--card:rgba(24,24,28,.88);--card2:rgba(39,39,44,.55);
}
.cs-card{position:relative;width:100%;height:100%;background:var(--card);
  backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.13),0 1px 0 rgba(255,255,255,.14) inset;
  }
/* ---------- 展开面板（dock 形态）：数据全部来自宿主 chushi.music API ---------- */
.cs-live{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 16px 11px;
  opacity:0;pointer-events:none;transition:opacity .32s ease}
.cs-mode-fl .cs-live{opacity:1;pointer-events:auto}
.cs-empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;text-align:center;padding:12px}
.cs-mode-em .cs-empty{display:flex}
.cs-head{display:flex;align-items:center;gap:14px}
.cs-cov{position:relative;flex:none}
.cs-glow{position:absolute;inset:-7px;border-radius:22px;background:var(--acc);opacity:0;
  filter:blur(12px);transition:opacity .55s ease}
.cs-playing .cs-glow{opacity:.24}
.cs-pic{position:relative;width:96px;height:96px;border-radius:16px;overflow:hidden;
  background:linear-gradient(135deg,var(--acc32),var(--acc20));
  box-shadow:0 4px 14px rgba(0,0,0,.16);transition:transform .5s var(--ez)}
.cs-playing .cs-pic{transform:scale(1.02)}
.cs-pic img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
  transition:opacity .6s var(--ez),filter .5s ease}
.cs-pic img.on{opacity:1}
.cs-pz img{filter:saturate(.55) brightness(.9)}
.cs-dot{position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:var(--r9);
  background:var(--ok);box-shadow:0 0 6px var(--ok);opacity:0;transition:opacity .4s}
.cs-playing .cs-dot{opacity:1}
.cs-meta{flex:1;min-width:0;padding-right:24px}
.cs-t1{font-size:15px;font-weight:560;color:var(--ink);line-height:1.3;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cs-t2{font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.cs-t3{font-size:11px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.cs-swin{animation:cs-ri .5s var(--ez)}
@keyframes cs-ri{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.cs-x{position:absolute;right:10px;top:10px;appearance:none;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:var(--r9);color:var(--ink2);background:var(--card2);opacity:.85;
  transition:transform .35s var(--ez)}
.cs-x svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.cs-x:hover{transform:scale(1.08)}
.cs-seek{margin-top:13px;height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.cs-rail{position:relative;width:100%;height:4px;border-radius:4px;background:var(--pr)}
.cs-rail i{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:4px;background:var(--acc)}
.cs-rail u{position:absolute;left:0;top:50%;width:10px;height:10px;border-radius:var(--r9);background:#fff;
  border:2px solid var(--acc);transform:translate(-50%,-50%);pointer-events:none}
.cs-tm{display:flex;justify-content:space-between;margin-top:2px;font-size:10.5px;
  color:var(--ink3);font-variant-numeric:tabular-nums}
.cs-b{appearance:none;border:0;background:transparent;color:var(--ink2);width:38px;height:38px;
  border-radius:var(--r9);flex:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .25s var(--ez)}
.cs-b svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round}
.cs-b svg.fi{fill:currentColor;stroke:none}
.cs-b:hover{background:var(--card2);color:var(--ink);transform:scale(1.06)}
/* 主播放键：双图标绝对堆叠同圆心（布局零位移），切换 = opacity+scale 交叉过渡
   ——细线框▶与实心⏸流内排布 + display 硬切换曾被真机读作「按钮位移」，此法根治 */
.cs-bmain{width:46px;height:46px;color:#fff;background:var(--acc);position:relative;
  box-shadow:0 4px 14px var(--acc32),0 1px 0 rgba(255,255,255,.22) inset}
.cs-bmain svg{position:absolute;left:50%;top:50%;width:20px;height:20px;
  margin:-10px 0 0 -10px;opacity:1;
  transition:opacity .16s ease,transform .16s var(--ez)}
.cs-bmain svg.off{opacity:0;transform:scale(.55)}
.cs-bmain:active{transform:scale(.94)}
.cs-ctl{flex:1;display:flex;align-items:center;justify-content:center;gap:20px}
/* ---------- 逐字歌词：行/词 DOM 与高亮由宿主预计算驱动 ---------- */
.cs-lyr{position:relative;height:124px;margin-top:8px;overflow:hidden;flex:none;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent)}
.cs-lyr-in{position:absolute;left:0;right:0;top:0;transition:transform .55s var(--ez);will-change:transform}
.cs-ln{padding:4px 2px;text-align:center;font-size:14.5px;font-weight:560;line-height:1.45;
  color:var(--ink3);transition:color .3s ease}
.cs-ln.on{color:var(--ink)}
.cs-ln.gap{font-size:11px;letter-spacing:7px;color:var(--ink3)}
/* 逐字扫色：双层实体色 + clip-path（background-clip:text 在 transform 过场中
   会整词隐形闪动；底层永远实体色可见，上层同文本按 --p 裁剪显色） */
.cs-w{position:relative;color:var(--ink3)}
.cs-w .ov{position:absolute;left:0;top:0;color:var(--ink);pointer-events:none;
  clip-path:inset(-8% calc(100% - var(--p,0%)) -8% 0)}
.cs-sub{font-size:11px;font-weight:400;color:var(--ink2);margin-top:2px;display:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-ln.on .cs-sub{display:block}
.cs-foot{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);margin-top:auto}
.cs-led{width:6px;height:6px;border-radius:var(--r9);background:var(--ok);flex:none;transition:background .3s}
.cs-led.pz{background:#fbbf24}
/* ---------- 提示芯片 ---------- */
.cs-chip{position:absolute;left:50%;transform:translateX(-50%);z-index:4;display:none;
  align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r9);
  font-size:11px;font-weight:550;white-space:nowrap;pointer-events:none;
  background:var(--ink);color:var(--card);box-shadow:0 3px 12px rgba(0,0,0,.22)}
.cs-chip.on{display:flex;animation:cs-chipin .3s var(--ez)}
@keyframes cs-chipin{from{opacity:0;transform:translateX(-50%) translateY(-5px)}to{opacity:1;transform:translateX(-50%)}}
.cs-chip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.cs-chip.warn{background:#b45309;color:#fff}
/* ---------- 空态 ---------- */
.cs-eic{color:var(--acc66)}
.cs-e1{font-size:12.5px;font-weight:550;color:var(--ink)}
.cs-e2{font-size:11px;color:var(--ink3);line-height:1.5;max-width:250px}
.cs-hide{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="cs-i-play" viewBox="0 0 24 24"><path d="M8 4l12 8-12 8V4z"/></symbol>
    <symbol id="cs-i-pause" viewBox="0 0 24 24"><rect x="6.6" y="4.6" width="3.6" height="14.8" rx="1.3"/><rect x="13.8" y="4.6" width="3.6" height="14.8" rx="1.3"/></symbol>
    <symbol id="cs-i-prev" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16z"/><path d="M6 5.5v13"/></symbol>
    <symbol id="cs-i-next" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4z"/><path d="M18 5.5v13"/></symbol>
    <symbol id="cs-i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="cs-i-warn" viewBox="0 0 24 24"><path d="M12 4L2.6 20h18.8L12 4z"/><path d="M12 10.5v4"/><path d="M12 17.4v.2"/></symbol>
    <symbol id="cs-i-note" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.4"/><path d="M10 16V8.6l5.4 3"/></symbol>
  </defs>
</svg>

<div class="cs-card cs-mode-em" id="csCard">
  <section class="cs-live" id="csPanel">
    <div class="cs-head">
      <div class="cs-cov" id="csCov">
        <span class="cs-glow"></span>
        <span class="cs-pic cs-pz" id="csPic"><img id="csCoverImg" alt=""></span>
        <span class="cs-dot"></span>
      </div>
      <div class="cs-meta">
        <div class="cs-t1" id="csT1">—</div>
        <div class="cs-t2" id="csT2"></div>
        <div class="cs-t3" id="csT3"></div>
      </div>
    </div>
    <button class="cs-x" id="csClose" title="收起"><svg><use href="#cs-i-chev"/></svg></button>
    <div class="cs-seek" id="csSeek">
      <div class="cs-rail"><i id="csFill"></i><u id="csThumb"></u></div>
      <div class="cs-chip" id="csNote"><svg><use href="#cs-i-warn"/></svg><span id="csNoteTxt"></span></div>
    </div>
    <div class="cs-chip warn" id="csUpd" style="top:8px"><svg><use href="#cs-i-warn"/></svg><span id="csUpdTxt"></span></div>
    <div class="cs-tm"><span id="csTCur">0:00</span><span id="csTDur">--:--</span></div>
    <div class="cs-ctl">
      <button class="cs-b" id="csPrev" title="上一首"><svg><use href="#cs-i-prev"/></svg></button>
      <button class="cs-b cs-bmain" id="csPlay" title="播放 / 暂停">
        <svg class="fi" id="csIcPlay"><use href="#cs-i-play"/></svg>
        <svg class="fi off" id="csIcPause"><use href="#cs-i-pause"/></svg>
      </button>
      <button class="cs-b" id="csNext" title="下一首"><svg><use href="#cs-i-next"/></svg></button>
    </div>
    <div class="cs-lyr cs-hide" id="csLyr"><div class="cs-lyr-in" id="csLyrIn"></div></div>
    <div class="cs-foot"><span class="cs-led" id="csLed"></span><span id="csFootTxt">未连接</span></div>
  </section>
  <section class="cs-empty" id="csEmpty">
    <svg class="cs-eic" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#cs-i-note"/></svg>
    <div class="cs-e1" id="csE1">系统媒体待接入</div>
    <div class="cs-e2" id="csE2">安装初始三插件（SMTC Manager / Music Bridge / Lyric Source）并播放音乐即自动接入</div>
  </section>
</div>

<script>
(function () {
  "use strict";
  /* ================= ChuShi music widget v5.0.0（全新实现）=================
     纯渲染层：解析/插值/对齐/淡入淡出全部由宿主 chushi.music API 预计算，
     本层每帧只做取数 + 写样式。布局零位移三律：主键双 SVG 同圆心堆叠、
     歌词高度迟滞（歌词短暂缺失不塌面板）、无逐帧布局读写。 */
  var H = { fl: 248, em: 92 }, LY_H = 124, W = 340;
  var DEF = "asset:cover.svg";
  function $(id) { return document.getElementById(id); }

  var root = $("csCard"), pic = $("csPic"), img = $("csCoverImg");
  var t1 = $("csT1"), t2 = $("csT2"), t3 = $("csT3");
  var seekBox = $("csSeek"), fill = $("csFill"), thumb = $("csThumb");
  var chipNote = $("csNote"), noteTxt = $("csNoteTxt");
  var chipUpd = $("csUpd"), updTxt = $("csUpdTxt");
  var tCur = $("csTCur"), tDur = $("csTDur");
  var icPlay = $("csIcPlay"), icPause = $("csIcPause");
  var lyBox = $("csLyr"), lyInr = $("csLyrIn");
  var led = $("csLed"), footTxt = $("csFootTxt");
  var e1 = $("csE1"), e2 = $("csE2");

  /* 宿主过旧：静态提示，不进入渲染循环 */
  if (!window.chushi || !window.chushi.music || typeof window.chushi.music.now !== "function") {
    e1.textContent = "宿主版本过旧";
    e2.textContent = "请更新「初始」后再导入本预设";
    root.className = "cs-card cs-mode-em";
    if (window.chushi && typeof window.chushi.resize === "function") chushi.resize(340, H.em);
    return;
  }
  var mus = window.chushi.music;

  var snap = mus.snapshot() || null;
  var mode = "em";
  var lyHold = false;          /* 歌词高度迟滞：短暂缺失不塌面板（按钮不跳） */
  var lyKey = "", lyRef = null, lyMode = 0;
  var lineEls = [];            /* [{el, words:[{ov}], line}] */
  var activeLine = -2;
  var drag = false, dragRatio = 0;
  var optP = false, optAt = 0; /* 播放/暂停乐观翻转窗口 */
  var trackKey = "";
  var prevShownPlaying = null;

  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    var m = Math.floor(s / 60), r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  function hasLyric() { return !!(snap && snap.lyric && snap.lyric.lines && snap.lyric.lines.length); }
  function hFor() { return mode === "fl" && (hasLyric() || lyHold) ? H.fl + LY_H : H[mode]; }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  function setMode(m) {
    if (m === mode) return;
    mode = m;
    root.className = "cs-card cs-mode-" + m;
    if (window.chushi && typeof window.chushi.resize === "function") chushi.resize(W, hFor());
  }

  /* ---------- 播放态（含乐观窗口） ---------- */
  function effPlaying() {
    if (optAt && Date.now() - optAt < 2500) return optP;
    return !!(snap && snap.playing);
  }
  function playVisual(on) {
    icPlay.classList.toggle("off", on);
    icPause.classList.toggle("off", !on);
    root.classList.toggle("cs-playing", on);
    pic.classList.toggle("cs-pz", !on);
    led.classList.toggle("pz", !on);
  }

  /* ---------- 封面：单 img 淡入 + 自缓存属性防重复解码 ---------- */
  function renderCover(s) {
    var src = s.cover || s.coverUrl || DEF;
    if (img.getAttribute("src") !== src && img.__cs !== src) {
      img.__cs = src;
      img.src = src;
    }
    img.classList.add("on");
  }

  /* ---------- 芯片与页脚（诚实归因文案） ---------- */
  function renderChips(s) {
    if (s.seekNote) {
      chipNote.classList.add("on");
      noteTxt.textContent = s.seekNote;
    } else {
      chipNote.classList.remove("on");
    }
    if (s.needsUpdate) {
      chipUpd.classList.add("on");
      updTxt.textContent = s.needsBridge
        ? (s.engineOld
          ? "音乐桥版本过旧 · 更新 ChuShi Music Bridge 插件并重启网易云"
          : "音乐桥未连接 · 安装 ChuShi Music Bridge 插件并重启网易云")
        : (!s.pluginVer
          ? "音乐桥未就绪 · 确认 ChuShi Music Bridge 插件在网易云插件列表中已启用"
          : "组件待更新 · 请更新三个 .plugin 至最新版并重启网易云");
    } else {
      chipUpd.classList.remove("on");
    }
    footTxt.textContent = s.seekNote
      ? s.seekNote
      : ("已连接 · " + (s.pluginVer ? "API v" + s.pluginVer : "") +
        (s.smtcVer ? " · 管理 v" + s.smtcVer : ""));
  }

  /* ---------- 歌词 DOM 构建（歌词键 + 对象引用双判定才重建） ---------- */
  function buildLyric() {
    var l = snap && snap.lyric;
    var key = (snap && snap.lyricRev || "") + (l ? "#" + (l.mode || 0) + ":" + (l.lines ? l.lines.length : 0) : "#0");
    if (key === lyKey && l === lyRef) return;
    lyKey = key;
    lyRef = l;
    activeLine = -2;
    lyInr.innerHTML = "";
    lineEls = [];
    lyMode = 0;
    if (l && l.lines && l.lines.length) {
      lyMode = l.mode || 0;
      lyBox.classList.remove("cs-hide");
      for (var i = 0; i < l.lines.length; i++) {
        var ln = l.lines[i];
        var row = document.createElement("div");
        row.className = "cs-ln";
        var words = [];
        if (lyMode === 1 && ln.w && ln.w.length) {
          for (var w = 0; w < ln.w.length; w++) {
            var sp = document.createElement("span");
            sp.className = "cs-w";
            sp.appendChild(document.createTextNode(ln.w[w].t));
            var ov = document.createElement("span");
            ov.className = "ov";
            ov.appendChild(document.createTextNode(ln.w[w].t));
            sp.appendChild(ov);
            row.appendChild(sp);
            words.push({ ov: ov });
          }
          if (!ln.t) row.classList.add("gap");
        } else {
          row.textContent = ln.t || "· · ·";
          if (!ln.t) row.classList.add("gap");
        }
        if (ln.tr) {
          var sub = document.createElement("div");
          sub.className = "cs-sub";
          sub.textContent = ln.tr;
          row.appendChild(sub);
        }
        lyInr.appendChild(row);
        lineEls.push({ el: row, words: words, line: ln });
      }
      lyHold = true;
    } else {
      /* 歌词缺席：只藏 DOM，lyHold 不动（高度迟滞由切歌时重算） */
      lyBox.classList.add("cs-hide");
    }
    if (window.chushi && typeof window.chushi.resize === "function") chushi.resize(W, hFor());
  }

  /* ---------- 逐帧歌词渲染：行切换 + 当前词扫色 + 暂停淡入淡出 ---------- */
  function lyricFrame(n) {
    if (!lyMode) return;
    if (n.lineIndex !== activeLine) {
      var prev = activeLine;
      activeLine = n.lineIndex;
      if (prev >= 0 && prev < lineEls.length) finalizeLine(prev);
      for (var i = 0; i < lineEls.length; i++) {
        lineEls[i].el.classList.toggle("on", i === activeLine);
      }
      if (activeLine >= 0 && activeLine < lineEls.length) {
        var el = lineEls[activeLine].el;
        var target = (lyBox.clientHeight - el.offsetHeight) / 2 - el.offsetTop;
        lyInr.style.transform = "translateY(" + target + "px)";
      }
    }
    /* 逐帧只写当前行的词（性能律：其余行在离场时一次性定稿） */
    if (lyMode === 1 && activeLine >= 0 && activeLine < lineEls.length) {
      var ws = lineEls[activeLine].words;
      for (var j = 0; j < ws.length; j++) {
        var p = j < n.wordIndex ? 1 : j > n.wordIndex ? 0 : (n.wordIndex >= 0 ? n.wordProgress : 0);
        ws[j].ov.style.setProperty("--p", (p * 100).toFixed(1) + "%");
      }
    }
    /* 播放态翻转：暂停淡出 / 恢复淡入（fadeMs 由宿主按当前词剩余时长算好） */
    if (prevShownPlaying !== n.playing) {
      prevShownPlaying = n.playing;
      var fd = Math.max(120, Math.min(420, n.fadeMs || 260));
      lyInr.style.transition = "transform .55s var(--ez), opacity " + fd + "ms ease";
      lyInr.style.opacity = n.playing ? "1" : "0.38";
    }
  }
  function finalizeLine(idx) {
    /* 行离场定稿：已唱词全量显色，未唱词全量隐藏 */
    var ws = lineEls[idx].words;
    for (var j = 0; j < ws.length; j++) {
      ws[j].ov.style.setProperty("--p", "100%");
    }
  }

  /* ---------- 主渲染 ---------- */
  function render() {
    var s = snap;
    if (!s || !s.connected) {
      e1.textContent = "系统媒体待接入";
      e2.textContent = "安装初始三插件（SMTC Manager / Music Bridge / Lyric Source）并播放音乐即自动接入";
      footTxt.textContent = "未连接";
      setMode("em");
      return;
    }
    setMode("fl");
    var key = [s.title, s.artist, s.album, s.app].join("|");
    if (key !== trackKey) {
      trackKey = key;
      lyHold = hasLyric();       /* 切歌时重算歌词高度迟滞 */
      lyKey = "\u0000force";     /* 强制重建 */
      buildLyric();
      replay(t1); replay(t2); replay(t3);
    } else {
      buildLyric();
    }
    t1.textContent = s.title || "—";
    t2.textContent = s.artist || "";
    t3.textContent = s.album || "";
    renderCover(s);
    renderChips(s);
    playVisual(effPlaying());
    if (optAt && Date.now() - optAt >= 2500 && s.playing === optP) { /* 真值已确认，窗口自然过期 */ }
  }
  function replay(el) {
    el.classList.remove("cs-swin");
    void el.offsetWidth;
    el.classList.add("cs-swin");
  }

  /* ---------- 交互 ---------- */
  $("csClose").addEventListener("click", function () {
    if (window.chushi && typeof window.chushi.close === "function") chushi.close();
  });
  $("csPrev").addEventListener("click", function () { mus.prev(); });
  $("csNext").addEventListener("click", function () { mus.next(); });
  $("csPlay").addEventListener("click", function () {
    var cur = effPlaying();
    optP = !cur;
    optAt = Date.now();
    playVisual(optP);
    mus.toggle();
  });

  function ratioOf(e) {
    var r = seekBox.getBoundingClientRect();
    return clamp01((e.clientX - r.left) / Math.max(1, r.width));
  }
  function showDragVisual() {
    var pct = (dragRatio * 100).toFixed(2) + "%";
    fill.style.width = pct;
    thumb.style.left = pct;
    if (snap && snap.duration > 0) tCur.textContent = fmt(dragRatio * snap.duration);
  }
  seekBox.addEventListener("pointerdown", function (e) {
    if (!(snap && snap.duration > 0)) return;
    drag = true;
    dragRatio = ratioOf(e);
    try { seekBox.setPointerCapture(e.pointerId); } catch (err) { }
    showDragVisual();
  });
  seekBox.addEventListener("pointermove", function (e) {
    if (!drag) return;
    dragRatio = ratioOf(e);
    showDragVisual();
  });
  seekBox.addEventListener("pointerup", function (e) {
    if (!drag) return;
    drag = false;
    dragRatio = ratioOf(e);
    showDragVisual();
    mus.seek(dragRatio * (snap ? snap.duration : 0));
  });
  seekBox.addEventListener("pointercancel", function () { drag = false; });

  /* ---------- rAF 主循环（永不停止；拖动中优先显示拖动值） ---------- */
  function loop() {
    if (drag) {
      showDragVisual();
    } else {
      var n = mus.now();
      var pct = (n.progress * 100).toFixed(2) + "%";
      fill.style.width = pct;
      thumb.style.left = pct;
      tCur.textContent = fmt(n.position);
      tDur.textContent = n.duration > 0 ? fmt(n.duration) : "--:--";
      lyricFrame(n);
    }
    requestAnimationFrame(loop);
  }

  mus.subscribe(function (s) {
    snap = s;
    render();
  });
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
