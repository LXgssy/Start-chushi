<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChuShi Music</title>
<style>
:root{color-scheme:light dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{
  font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  user-select:none;
  --ink:#27272a;--ink2:#71717a;--ink3:#a1a1aa;--line:rgba(0,0,0,.08);
  --pr:rgba(0,0,0,.10);--ok:#34d399;--card:rgba(255,255,255,.86);--card2:rgba(255,255,255,.55);
  --acc:var(--w-accent,#8b5cf6);
  --acc20:color-mix(in oklab,var(--acc) 20%,transparent);
  --acc32:color-mix(in oklab,var(--acc) 32%,transparent);
  --acc66:color-mix(in oklab,var(--acc) 66%,transparent);
  /* 「初始」内建同款真实缓动（跨 iframe 拿不到宿主变量，给真值） */
  --ez:cubic-bezier(.22,1,.36,1);--r9:999px;
}
[data-theme=dark] body{
  --ink:#f4f4f5;--ink2:#a1a1aa;--ink3:#71717a;--line:rgba(255,255,255,.09);
  --pr:rgba(255,255,255,.12);--card:rgba(24,24,28,.88);--card2:rgba(39,39,44,.55);
}
.cs-card{position:relative;width:100%;height:100%;background:var(--card);
  backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.13),0 1px 0 rgba(255,255,255,.14) inset;
  }
/* v8.2.2 封面原生拖拽 ghost 禁止（用户实机反馈：面板与浮窗同律） */
img{-webkit-user-drag:none;user-select:none}
/* ---------- 展开面板（dock 形态）：数据全部来自宿主 chushi.music API ---------- */
.cs-live{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 16px 11px;
  opacity:0;pointer-events:none;transition:opacity .32s ease}
.cs-mode-fl .cs-live{opacity:1;pointer-events:auto}
.cs-empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;text-align:center;padding:12px}
.cs-mode-em .cs-empty{display:flex}
.cs-head{display:flex;align-items:center;gap:14px}
.cs-cov{position:relative;flex:none;display:block}
/* v8.0.1：cs-pic 是嵌套 span（非 flex 直接子元素），行内 width/height 无效，
   显式块化后 96px 才无条件生效（否则封面铺满整面板、标题列 0 宽） */
.cs-pic{position:relative;display:block;width:96px;height:96px;border-radius:16px;overflow:hidden;
  background:linear-gradient(135deg,var(--acc32),var(--acc20));
  box-shadow:0 4px 14px rgba(0,0,0,.16);transition:transform .5s var(--ez)}
.cs-playing .cs-pic{transform:scale(1.02)}
.cs-glow{position:absolute;inset:-8px;border-radius:23px;background:var(--acc);opacity:0;
  filter:blur(13px);transition:opacity .55s ease}
.cs-playing .cs-glow{opacity:.24}
/* v8.2.8 去方框律：.cs-ring 细节环废弃（用户：方框太丑）——中高频细节
   改由辉光本体 opacity/scale 全频段合成承担（beatFrame） */
.cs-pic img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
  transition:opacity .6s var(--ez),filter .5s ease}
.cs-pic img.on{opacity:1}
.cs-pz img{filter:saturate(.55) brightness(.9)}
.cs-dot{position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:var(--r9);
  background:var(--ok);box-shadow:0 0 6px var(--ok);opacity:0;transition:opacity .4s}
.cs-playing .cs-dot{opacity:1}
.cs-meta{flex:1;min-width:0;padding-right:24px}
.cs-t1{font-size:15px;font-weight:560;color:var(--ink);line-height:1.3;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cs-t2{font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.cs-t3{font-size:11px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
/* 切歌滑入动画已随 v8.0.6 瘦身移除（切歌反馈由封面/歌词变化承担） */
.cs-x{position:absolute;right:10px;top:10px;appearance:none;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:var(--r9);color:var(--ink2);background:var(--card2);opacity:.85}
.cs-x svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.cs-x:hover{transform:scale(1.08);color:var(--ink)}
/* v8.0.6 进度条交互恢复：InfLink seekTo 通路实测可控（系统卡片跳转同源），
   拖动/点击均可调进度；拖动中本地预览，松手 mus.seek（失败由宿主 seekAck
   → seekNote 芯片诚实呈现，成功由宿主乐观重锚） */
.cs-seek{margin-top:13px;height:14px;display:flex;align-items:center;cursor:pointer;
  touch-action:none}
/* v8.0.9 悬停放大过渡律：轨道 4→6px 加缓动，不再瞬变
   v8.1.4 帧率根治：height 过渡每帧触发 layout（backdrop-filter 卡片内
   代价极高），改 scaleY 合成层动画——轨道恒 6px，默认压至 4px 视觉高，
   悬停弹回 6px；transform 只走 compositor，掉帧根除 */
.cs-rail{position:relative;width:100%;height:6px;border-radius:4px;background:var(--pr);
  overflow:hidden;transform:scaleY(.667);transform-origin:50% 50%;
  transition:transform .2s var(--ez);will-change:transform}
.cs-seek:hover .cs-rail{transform:scaleY(1)}
.cs-rail i{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:4px;background:var(--acc)}
.cs-tm{display:flex;justify-content:space-between;margin-top:2px;font-size:10.5px;
  color:var(--ink3);font-variant-numeric:tabular-nums}
.cs-b{appearance:none;border:0;background:transparent;color:var(--ink2);width:38px;height:38px;
  border-radius:var(--r9);flex:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer}
.cs-b svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round}
.cs-b svg.fi{fill:currentColor;stroke:none}
.cs-b:hover{background:var(--card2);color:var(--ink);transform:scale(1.06)}
/* v8.0.9 悬停高光渐显律：播放/上一首/下一首/关闭键的背景、前景色、提亮
   全部加缓动（ease 为 transition 默认时序，省字符），高光淡入不再突兀 */
.cs-b,.cs-x{transition:transform .25s var(--ez),background-color .3s,color .3s,filter .3s}
/* v8.0.3 主键悬停律：.cs-b:hover 的 card2 半透暗底/ink 深色前景/scale 与主键
   accent 白图标三重冲突（同特异性按序胜出=悬停变黑+图标视觉位移），
   主键悬停恒保 accent 底白图标，仅提亮不加位移 */
.cs-bmain:hover{color:#fff;background:var(--acc);filter:brightness(1.12);transform:none}
/* 主播放键：双图标绝对堆叠同圆心（布局零位移），切换 = opacity+scale 交叉过渡
   ——细线框▶与实心⏸流内排布 + display 硬切换曾被真机读作「按钮位移」，此法根治 */
.cs-bmain{width:46px;height:46px;color:#fff;background:var(--acc);position:relative;
  box-shadow:0 4px 14px var(--acc32),0 1px 0 rgba(255,255,255,.22) inset}
.cs-bmain svg{position:absolute;left:50%;top:50%;width:20px;height:20px;
  margin:-10px 0 0 -10px;opacity:1;
  transition:opacity .16s ease,transform .16s var(--ez)}
.cs-bmain svg.off{opacity:0;transform:scale(.55)}
.cs-bmain:active{transform:scale(.94)}
.cs-ctl{flex:1;display:flex;align-items:center;justify-content:center;gap:20px}
/* ---------- 逐字歌词：行/词 DOM 与高亮由宿主预计算驱动 ----------
   v8.3.3 done 行常驻提层（模糊防重置：过渡结束降层重栅格化会把合成器
   实时模糊换成烘焙模糊 = 上一句模糊在定住瞬间质感阶跃）+ 高光归位
   （封面滤镜退役，能量全走 .cs-glow 封面底下）。
   v8.3.2 歌词动效与浮窗完全对齐（用户：动效要覆盖浮窗和面板；v8.3.1
   呼吸动效只落了浮窗，面板仍 .55s/.5s 旧时序且无呼吸无模糊——用户
   「新动效没看到」的直接原因）：
   · 呼吸缩放——当前行 scale 1.06/邻行 0.94，transform 不参与布局
     （offsetTop 滚动数学不受影响）；
   · 高斯模糊景深——未唱行 blur 2px/已唱行 blur 1.1px/当前行 sharp，
     filter 同曲线过渡，行切换时「聚焦」浮现；
   · 滚动 .55s→.45s、行色 .5s→.35s（JS 内联 transition 同步改）。 */
.cs-lyr{position:relative;height:146px;margin-top:8px;overflow:hidden;flex:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
/* v8.3.4 歌词防裁切律（浮窗同律）：长行（多行换行+翻译行）居中后余量不足，
   行顶/行底侵入 mask 渐隐区甚至被 overflow 硬裁（用户：歌词被边框吃掉）——
   容器 124→146px + 渐隐区改固定 18px + 行 padding 4→6px。LY_H 同步。 */
.cs-lyr-in{position:absolute;left:0;right:0;top:0;transition:transform .45s var(--ez);will-change:transform}
.cs-ln{padding:6px 4px;text-align:center;font-size:14.5px;font-weight:560;line-height:1.45;
  color:var(--ink3);transform:scale(.94);transform-origin:50% 50%;filter:blur(2px);
  transition:color .35s ease,transform .45s var(--ez),filter .45s var(--ez)}
/* v8.3.4【实证反悔律，浮窗同律】：on 行提层撤销——任何 will-change 都会把
   raster 冻结在 .94，1.06 静息显示下整体放大采样模糊（F15b 对照：无提层
   245 / transform 提层 203 / filter 提层 203）。当前行白亮不可牺牲。 */
.cs-ln.on{color:var(--ink);transform:scale(1.06);filter:blur(0)}
/* v8.2.3 两色调（与浮窗同律）：active 行未唱词底色居 ink/ink3 之间——
   行切换 0.6s 交叉渐隐窗口里当前行恒为视觉主角（旧底色与未来行同灰，
   上一行的白色渐隐残相在视觉上抢走高光 = 「高光跑到别行/封面」） */
.cs-ln.on .cs-w{color:color-mix(in oklab,var(--ink) 45%,var(--ink3))}
/* v8.0.4 已唱行渐隐律（用户指定「唱完等过了这句再渐变消失」）：行离场不再
   瞬消——遮罩定格 100%（全亮态），.ov 高亮层 opacity .6s 渐隐 + 行色
   ink→ink2 渐变到已唱灰；倒回（seek）时由 restoreLine 重置未唱态 */
.cs-ln.done{color:var(--ink2);filter:blur(1.1px);will-change:transform,filter}
  /* v8.3.3 模糊防重置律（浮窗同律）：done 行常驻合成层——过渡结束的
     降层重栅格化把合成器实时模糊换成原生烘焙模糊 = 上一句模糊在定住
     瞬间质感阶跃（用户：模糊有重置效果）。done 静息 scale .94 与
     raster 一致，提层零阶跃。 */
.cs-ln.done .cs-w{color:var(--ink2)}
.cs-ln.done .cs-w .ov{opacity:0;transition:opacity .6s ease}
.cs-ln.gap{font-size:11px;letter-spacing:7px;color:var(--ink3)}
/* 逐字扫色：双层实体色 + clip-path（background-clip:text 在 transform 过场中
   会整词隐形闪动；底层永远实体色可见，上层同文本按 --p 裁剪显色） */
.cs-w{position:relative;color:var(--ink3)}
.cs-w .ov{position:absolute;left:0;top:0;color:var(--ink);pointer-events:none;
  clip-path:inset(-8% calc(100% - var(--p,0%)) -8% 0)}
/* v8.3.4 切行防「咯噔」之一（主因，浮窗同律）：翻译行 display:none↔block
   硬切 = 切行瞬间旧行高 -17px / 新行高 +17px 布局瞬跳。改显式 height 过渡：
   翻译行 nowrap 单行恒高（11px×1.5=17px），height 0↔17px 平滑插值，
   布局零跳变（同行收/展同曲线抵消，下方行 offsetTop 恒定=零扰动）。
   【实证】grid-template-rows 0fr↔1fr 在本环境实测离散跳变（0→17 一步，
   无中间值）——fr 插值不可信，length 插值（height）100% 可靠。
   滚动 target 由 lyricFrame 逐帧追踪（见 lyrTrackUntil）。 */
.cs-subw{display:grid;grid-template-rows:1fr;height:0;opacity:0;overflow:hidden;
  transition:height .38s var(--ez),opacity .38s ease}
.cs-ln.on .cs-subw{height:17px;opacity:1}
.cs-subw .cs-sub{min-height:0;font-size:11px;font-weight:400;color:var(--ink2);line-height:1.5;
  white-space:nowrap;text-overflow:ellipsis}
.cs-foot{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);margin-top:auto}
.cs-led{width:6px;height:6px;border-radius:var(--r9);background:var(--ok);flex:none;transition:background .3s}
.cs-led.pz{background:#fbbf24}
/* v8.1.4 强行逐字开关 + v8.2.9 律动/浮窗双开关（宿主 storage 持久化） */
.cs-wbw,.cs-tg{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink3);
  font-size:10px;font-weight:550;line-height:1;padding:3px 9px;border-radius:var(--r9);
  cursor:pointer;flex:none;transition:color .25s,background-color .25s,border-color .25s}
.cs-wbw{margin-left:auto}
.cs-wbw:hover,.cs-tg:hover{color:var(--ink)}
.cs-wbw.on,.cs-tg.on{color:#fff;background:var(--acc);border-color:var(--acc)}
/* ---------- 提示芯片 ---------- */
.cs-chip{position:absolute;left:50%;transform:translateX(-50%);z-index:4;display:none;
  align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r9);
  font-size:11px;font-weight:550;white-space:nowrap;pointer-events:none;
  background:var(--ink);color:var(--card);box-shadow:0 3px 12px rgba(0,0,0,.22)}
.cs-chip.on{display:flex;animation:cs-chipin .3s var(--ez)}
@keyframes cs-chipin{from{opacity:0;transform:translateX(-50%) translateY(-5px)}to{opacity:1;transform:translateX(-50%)}}
.cs-chip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.cs-chip.warn{background:#b45309;color:#fff}
/* ---------- 空态 ---------- */
.cs-eic{color:var(--acc66)}
.cs-e1{font-size:12.5px;font-weight:550;color:var(--ink)}
.cs-e2{font-size:11px;color:var(--ink3);line-height:1.5;max-width:250px}
.cs-hide{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="cs-i-play" viewBox="0 0 24 24"><path d="M8 4l12 8-12 8V4z"/></symbol>
    <symbol id="cs-i-pause" viewBox="0 0 24 24"><rect x="6.6" y="4.6" width="3.6" height="14.8" rx="1.3"/><rect x="13.8" y="4.6" width="3.6" height="14.8" rx="1.3"/></symbol>
    <symbol id="cs-i-prev" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16z"/><path d="M6 5.5v13"/></symbol>
    <symbol id="cs-i-next" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4z"/><path d="M18 5.5v13"/></symbol>
    <symbol id="cs-i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="cs-i-warn" viewBox="0 0 24 24"><path d="M12 4L2.6 20h18.8L12 4z"/><path d="M12 10.5v4"/><path d="M12 17.4v.2"/></symbol>
    <symbol id="cs-i-note" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.4"/><path d="M10 16V8.6l5.4 3"/></symbol>
  </defs>
</svg>

<div class="cs-card cs-mode-em" id="csCard">
  <section class="cs-live" id="csPanel">
    <div class="cs-head">
      <div class="cs-cov" id="csCov">
        <span class="cs-glow"></span>
        <span class="cs-pic cs-pz" id="csPic"><img id="csCoverImg" alt="" draggable="false"></span>
        <span class="cs-dot"></span>
      </div>
      <div class="cs-meta">
        <div class="cs-t1" id="csT1">—</div>
        <div class="cs-t2" id="csT2"></div>
        <div class="cs-t3" id="csT3"></div>
      </div>
    </div>
    <button class="cs-x" id="csClose" title="收起"><svg><use href="#cs-i-chev"/></svg></button>
    <div class="cs-seek" id="csSeek">
      <div class="cs-rail"><i id="csFill"></i></div>
      <div class="cs-chip" id="csNote"><svg><use href="#cs-i-warn"/></svg><span id="csNoteTxt"></span></div>
    </div>
    <div class="cs-chip warn" id="csUpd" style="top:8px"><svg><use href="#cs-i-warn"/></svg><span id="csUpdTxt"></span></div>
    <div class="cs-tm"><span id="csTCur">0:00</span><span id="csTDur">--:--</span></div>
    <div class="cs-ctl">
      <button class="cs-b" id="csPrev" title="上一首"><svg><use href="#cs-i-prev"/></svg></button>
      <button class="cs-b cs-bmain" id="csPlay" title="播放 / 暂停">
        <svg class="fi" id="csIcPlay"><use href="#cs-i-play"/></svg>
        <svg class="fi off" id="csIcPause"><use href="#cs-i-pause"/></svg>
      </button>
      <button class="cs-b" id="csNext" title="下一首"><svg><use href="#cs-i-next"/></svg></button>
    </div>
    <div class="cs-lyr cs-hide" id="csLyr"><div class="cs-lyr-in" id="csLyrIn"></div></div>
    <div class="cs-foot"><span class="cs-led" id="csLed"></span><span id="csFootTxt">未连接</span><button class="cs-wbw" id="csWbw" type="button" title="强行逐字歌词：为没有逐字时间轴的歌词按估算添加逐字效果，准确率低；关闭时使用逐行歌词">强行逐字</button><button class="cs-tg on" id="csGlowBtn" type="button" title="高光律动：封面亮度/光晕随音乐高低频呼吸（本面板与悬浮卡同步）">律动</button><button class="cs-tg on" id="csFloatBtn" type="button" title="悬浮音乐卡：开启后在所有网页顶部显示">浮窗</button></div>
  </section>
  <section class="cs-empty" id="csEmpty">
    <svg class="cs-eic" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#cs-i-note"/></svg>
    <div class="cs-e1" id="csE1">系统媒体待接入</div>
    <div class="cs-e2" id="csE2">安装 InfLink-rs 与初始插件并播放音乐即自动接入</div>
  </section>
</div>

<script>
(function () {
  "use strict";
  /* ================= ChuShi music widget v8.2.9（纯渲染层）=================
     v8.2.9：① 面板「律动」「浮窗」双开关（右键隐藏退役，浮窗全局显隐）
     ② 逐行行级时钟（mus.now(true)——行界不受逐字 -100ms 补偿拖累）
     ③ 频段细化 128 段自适应（中/高轴区间随 bands.length 切换）
     v8.2.8：① 去方框律（.cs-ring 废弃，全频段细腻律同浮窗参数族）
     ② 间奏滚动跟进（seek 跨间奏歌词区立即滚到已唱界行，浮窗同律）
     ③ 歌词时基延后 100ms（宿主 alignAt 延迟补偿，逐字超前唱声根治）
     解析/插值/对齐/淡入淡出全部由宿主 chushi.music API 预计算，

  }

  /* ---------- 交互 ---------- */
  /* v8.1.4 强行逐字开关：状态持久化在宿主 storage；切换即强制重建歌词
     DOM（mode 重判：伪逐字↔逐行），真逐字（yrc）不受影响。默认关。 */
  var wbwBtn = $("csWbw");
  function applyWbw(r) {
    wbwBtn.classList.toggle("on", forceWord);
    if (r) { lyKey = "\u0000force"; buildLyric(); }
  }
  wbwBtn.onclick = function () {
    forceWord = !forceWord;
    applyWbw(true);
    if (window.chushi && chushi.storage) chushi.storage.set("csForceWord", forceWord);
  };
  /* v8.2.9 双开关：律动（本面板与浮窗同步生效）+ 浮窗（全局显隐）。
     默认均开；持久化 csGlow/csFloat，由宿主 PresetWidgets 镜像到
     chrome.storage.local（cardGlow/cardEnabled）给扩展侧。 */
  var glowBtn = $("csGlowBtn"), floatBtn = $("csFloatBtn");
  var glowOn = true, floatOn = true;
  function applyToggles() {
    glowBtn.classList.toggle("on", glowOn);
    floatBtn.classList.toggle("on", floatOn);
  }
  glowBtn.onclick = function () {
    glowOn = !glowOn;
    applyToggles();
    if (!glowOn) beatFrame(null); /* 立即熄灯归还样式表 */
    if (window.chushi && chushi.storage) chushi.storage.set("csGlow", glowOn);
  };
  floatBtn.onclick = function () {
    floatOn = !floatOn;
    applyToggles();
    if (window.chushi && chushi.storage) chushi.storage.set("csFloat", floatOn);
  };
  if (window.chushi && chushi.storage) {
    chushi.storage.get("csForceWord").then(function (v) {
      if ((v === true) !== forceWord) { forceWord = v === true; applyWbw(true); }
      else applyWbw(false);
    }).catch(function () { });
    chushi.storage.get("csGlow").then(function (v) {
      glowOn = v !== false && v !== "false"; applyToggles();
    }).catch(function () { });
    chushi.storage.get("csFloat").then(function (v) {
      floatOn = v !== false && v !== "false"; applyToggles();
    }).catch(function () { });
  } else applyWbw(false);

  /* v8.0.9 关闭动画：先淡出面板（复用 .cs-live 自带 opacity 过渡）再收起，
     不再瞬间消失（用户指定「关闭动画同理」） */
  $("csClose").onclick = function () {
    $("csPanel").style.opacity = "0";
    setTimeout(function () { chushi.close(); }, 190);
  };
  function ctlFail(p, passed, clickedAt) {
    armCtlVerify(passed, clickedAt);
    p.then(function (ok) {
      if (ok !== true) noteCtl("音乐桥未连接 · 控制未送达");
    });
  }
  function songUnchanged() { var k0 = trackKey; return function () { return trackKey === k0; }; }
  $("csPrev").addEventListener("click", function () {
    ctlFail(mus.prev(), songUnchanged(), Date.now());
  });
  $("csNext").addEventListener("click", function () {
    ctlFail(mus.next(), songUnchanged(), Date.now());
  });
  $("csPlay").addEventListener("click", function () {
    var cur = effPlaying();
    optP = !cur;
    optAt = Date.now();
    playVisual(optP);
    /* 失败条件 = 验证窗口到期时真值仍 ≠ 期望态（armCtlVerify 语义：条件成立即亮芯片） */
    ctlFail(mus.toggle(), function () { return effPlaying() !== optP; }, optAt);
  });

  /* ---------- v8.0.6 进度条拖动跳转（InfLink seekTo 同源通路） ---------- */
  var scrub = { on: 0, r: 0, dur: 0 };
  function evR(e) {
    var rc = seekBox.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - rc.left) / (rc.width || 1)));
  }
  function scrubUI() {
    fill.style.width = (scrub.r * 100).toFixed(2) + "%";
    tCur.textContent = fmt(scrub.r * scrub.dur);
  }
  seekBox.onpointerdown = function (e) {
    var n = mus.now();
    if (!(n.duration > 0)) return;
    scrub.on = 1; scrub.dur = n.duration; scrub.r = evR(e);
    try { seekBox.setPointerCapture(e.pointerId); } catch (e1) { /* 已释放 */ }
    scrubUI();
  };
  seekBox.onpointermove = function (e) {
    if (scrub.on) { scrub.r = evR(e); scrubUI(); }
  };
  seekBox.onpointerup = function (e) {
    if (!scrub.on) return;
    scrub.on = 0;
    /* 失败：宿主 seekAck 管线 → seekNote 芯片；成功：宿主乐观重锚 */
    mus.seek(evR(e) * scrub.dur);
  };
  seekBox.onpointercancel = function () { scrub.on = 0; };

  /* ---------- v8.2.0 律动高光：bass 驱动封面高光（快攻慢放已由宿主包络完成）
     写入只碰 opacity/transform（合成器友好，v8.1.4 帧率律同源）；
     退出态恢复样式表控制（类切换的基态过渡不受干扰）。 ---------- */
  var glowEl = document.querySelector(".cs-glow");
  var picImgEl = document.getElementById("csCoverImg");
  var glowOn2 = 0, gLo = "", gLt = "", gLf = "";
  var calmMotion = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  function bandAvg(b, a, z) { var s = 0, i; for (i = a; i < z && i < b.length; i++) s += Number(b[i]) || 0; return z > a ? s / (z - a) : 0; }
  /* v8.2.8 去框化·全频段细腻律（浮窗同参数族）：.cs-ring 方框废弃——
     低音 = 提亮 + 辉光主推 + 对比微脉冲；中频 = 亮度微调 + 辉光次推 +
     光晕尺寸；高频 = 饱和脉冲 + 辉光点缀。pow 0.85 提升小信号可见度。
     bands 已由宿主包络（攻 0.62/放 0.16），部件端只做合成。
     v8.2.9：128 段·实际映射律（低频侧线性化 段k≈bin k+2：中 9..85 ≈
     250Hz~2kHz / 高 85..末端 ≈ 2k~16kHz），
     bands.length<100 时退回旧 16 段区间（兼容旧宿主/旧 native 缓存帧）；
     面板「律动」开关关 = 静态高光（beatFrame 直接熄灯）。
     写值防抖（不变不写），静默交还样式表（暂停 .cs-pz img 滤镜/类基态
     过渡不受内联残留干扰）。 */
  function beatFrame(n) {
    if (!glowEl) return;
    if (!glowOn) n = null; /* 面板「律动」开关：关 = 静态（走熄灯分支） */
    var b = !calmMotion && n && typeof n.bass === "number" ? n.bass : 0;
    var m = 0, h = 0;
    if (!calmMotion && n && n.bands && n.bands.length) {
      if (n.bands.length >= 100) { m = bandAvg(n.bands, 9, 85); h = bandAvg(n.bands, 85, n.bands.length); }
      else { m = bandAvg(n.bands, 3, 10); h = bandAvg(n.bands, 10, 16); }
    }
    /* v8.3.3 高光归位律（浮窗同律）：封面本体 brightness/saturate/
       contrast 滤镜退役——能量全部改走 .cs-glow（DOM 在 .cs-pic 之前
       = 封面底下；光环只从四周晕出）。增益拉满：低音主推 0.48→0.72、
       基线 0.22→0.30，scale 幅度 0.05→0.075；封面图本体恒定不动
       （暂停态 .cs-pz img 样式表滤镜不受内联残留干扰的老问题连根拔）。 */
    var act = effPlaying() && (b > 0.012 || m > 0.02 || h > 0.02);
    if (act) {
      var pb = Math.pow(b, 0.85), pm = Math.pow(m, 0.85), ph = Math.pow(h, 0.85);
      var go = Math.min(1, 0.30 + pb * 0.72 + pm * 0.30 + ph * 0.15).toFixed(3);
      var gs = "scale(" + (1 + b * 0.075 + m * 0.036 + h * 0.018).toFixed(4) + ")";
      if (go !== gLo) { if (!glowOn2) glowEl.style.transition = "none"; gLo = go; glowEl.style.opacity = go; }
      if (gs !== gLt) { gLt = gs; glowEl.style.transform = gs; }
      glowOn2 = 1;
    } else if (glowOn2) {
      glowOn2 = 0; gLo = gLt = "";
      glowEl.style.transition = "";
      glowEl.style.opacity = "";
      glowEl.style.transform = "";
    }
  }

  /* ---------- rAF 主循环（永不停止；拖动中用本地预览，不覆盖） ----------
     v8.2.2 写值防抖：进度/时间字符串不变不写 DOM（掉帧治理） */
  var lastFillW = "", lastTCur = "", lastTDur = "";
  function loop() {
    /* v8.2.9 行级时钟：逐行渲染（lyMode=0）传 true——行界判定不用逐字
       的 -100ms 延迟补偿（「逐行慢了一点」根治，浮窗同律） */
    var n = mus.now(lyMode === 0);
    if (scrub.on) {
      scrubUI();
    } else {
      var w = (n.progress * 100).toFixed(2) + "%";
      if (w !== lastFillW) { lastFillW = w; fill.style.width = w; }
      var tc = fmt(n.position);
      if (tc !== lastTCur) { lastTCur = tc; tCur.textContent = tc; }
    }
    var td = n.duration > 0 ? fmt(n.duration) : "--:--";
    if (td !== lastTDur) { lastTDur = td; tDur.textContent = td; }
    lyricFrame(n);
    beatFrame(n);
    requestAnimationFrame(loop);
  }

  mus.subscribe(function (s) {
    snap = s;
    render();
  });
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
