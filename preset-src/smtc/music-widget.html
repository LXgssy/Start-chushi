<style>
  :root{color-scheme:light dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent}
  body{
    font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;
    --ink:#27272a;--ink2:#71717a;--ink3:#a1a1aa;--line:rgba(0,0,0,.08);
    --pr:rgba(0,0,0,.10);--ok:#34d399;--card:rgba(255,255,255,.86);--card2:rgba(255,255,255,.55);
    --acc:var(--w-accent,#8b5cf6);
    --acc20:color-mix(in oklab,var(--acc) 20%,transparent);
    --acc32:color-mix(in oklab,var(--acc) 32%,transparent);
    --acc66:color-mix(in oklab,var(--acc) 66%,transparent);
    /* 与「初始」内建同款真实缓动（跨 iframe 拿不到宿主变量，给真值） */
    --ez:cubic-bezier(.22,1,.36,1);--r9:999px;
  }
  [data-theme=dark] body{
    --ink:#f4f4f5;--ink2:#a1a1aa;--ink3:#71717a;--line:rgba(255,255,255,.09);
    --pr:rgba(255,255,255,.12);--card:rgba(24,24,28,.88);--card2:rgba(39,39,44,.55);
  }
  .card{position:relative;width:100%;height:100%;background:var(--card);
    backdrop-filter:blur(22px) saturate(1.5);
    border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:0 10px 34px rgba(0,0,0,.13),0 1px 0 rgba(255,255,255,.14) inset;
    }
  /* ---------- 展开卡：dock 面板形态（v2.0.0：本预设只写面板样式，
     数据全部来自宿主 chushi.music API——封面/歌名/歌词/进度均已预计算） ---------- */
  .fl{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 16px 11px;
    opacity:0;pointer-events:none;transition:opacity .32s ease}
  .mode-fl .fl{opacity:1;pointer-events:auto}
  .rw{display:flex;align-items:center;gap:14px}
  .cw{position:relative;flex:none}
  .glow{position:absolute;inset:-7px;border-radius:22px;background:var(--acc);opacity:0;
    filter:blur(12px);transition:opacity .55s ease}
  .pl .glow{opacity:.24}
  .he{position:relative;width:96px;height:96px;border-radius:16px;overflow:hidden;
    background:linear-gradient(135deg,var(--acc32),var(--acc20));
    box-shadow:0 4px 14px rgba(0,0,0,.16);transition:transform .5s var(--ez)}
  .pl .he{transform:scale(1.02)}
  .he img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
    transition:opacity .6s var(--ez),filter .5s ease}
  .he img.on{opacity:1}
  .pz{filter:saturate(.55) brightness(.9)}
  .dot{position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:var(--r9);
    background:var(--ok);box-shadow:0 0 6px var(--ok);opacity:0;transition:opacity .4s}
  .pl .dot{opacity:1}
  .info{flex:1;min-width:0;padding-right:24px}
  .t1{font-size:15px;font-weight:560;color:var(--ink);line-height:1.3;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .t2{font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .t3{font-size:11px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .sw{animation:ri .5s var(--ez)}
  @keyframes ri{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .cx{position:absolute;right:10px;top:10px;appearance:none;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:var(--r9);color:var(--ink2);background:var(--card2);opacity:.85;
    transition:transform .35s var(--ez)}
  .cx svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .cx:hover{transform:scale(1.08)}
  .sk{margin-top:13px;height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  .rl{position:relative;width:100%;height:4px;border-radius:4px;background:var(--pr)}
  .rl i{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:4px;background:var(--acc)}
  .rl u{position:absolute;left:0;top:50%;width:10px;height:10px;border-radius:var(--r9);background:#fff;
    border:2px solid var(--acc);transform:translate(-50%,-50%);pointer-events:none}
  .tm{display:flex;justify-content:space-between;margin-top:2px;font-size:10.5px;
    color:var(--ink3);font-variant-numeric:tabular-nums}
  .bt{appearance:none;border:0;background:transparent;color:var(--ink2);width:38px;height:38px;
    border-radius:var(--r9);flex:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .25s var(--ez)}
  .bt svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round}
  .bt svg.pc{fill:currentColor;stroke:none}
  .bt:hover{background:var(--card2);color:var(--ink);transform:scale(1.06)}
  .bt.mi{width:46px;height:46px;color:#fff;background:var(--acc);position:relative;
    box-shadow:0 4px 14px var(--acc32),0 1px 0 rgba(255,255,255,.22) inset}
  /* v2.1.0 双图标绝对堆叠 + 交叉淡切：原双 svg 流内排布 + display 硬切换，
     细线框▶→实心⏸ 的视觉质量跳变被真机读作「按钮轻微位移」；
     现在两图标同圆心叠放（布局零位移），切换 = opacity+scale 交叉过渡 */
  .bt.mi svg{position:absolute;left:50%;top:50%;width:20px;height:20px;
    margin:-10px 0 0 -10px;opacity:1;
    transition:opacity .16s ease,transform .16s var(--ez)}
  .bt.mi svg.off{opacity:0;transform:scale(.55)}
  .bt.mi:active{transform:scale(.94)}
  .ct{flex:1;display:flex;align-items:center;justify-content:center;gap:20px}
  /* ---------- 逐字歌词（渲染层：行/词 DOM 与高亮均由宿主 API 预计算驱动） ---------- */
  .ly{position:relative;height:124px;margin-top:8px;overflow:hidden;flex:none;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent)}
  .lyin{position:absolute;left:0;right:0;top:0;transition:transform .55s var(--ez);will-change:transform}
  .lyline{padding:4px 2px;text-align:center;font-size:14.5px;font-weight:560;line-height:1.45;
    color:var(--ink3);transition:color .3s ease}
  .lyline.on{color:var(--ink)}
  .lyline.gap{font-size:11px;letter-spacing:7px;color:var(--ink3)}
  .lyw{position:relative;color:var(--ink3)}
  /* v2.0.1 逐字扫色改双层实体色 + clip-path：原 -webkit-background-clip:text
     + color:transparent 在 transform 过场中部分帧不绘制渐变，整词隐形闪动
     （真机 30fps 录屏实锤）；底层永远实体色可见，上层同文本按 --p 裁剪显色 */
  .lyw .ov{position:absolute;left:0;top:0;color:var(--ink);pointer-events:none;
    clip-path:inset(-8% calc(100% - var(--p,0%)) -8% 0)}
  .lysub{font-size:11px;font-weight:400;color:var(--ink2);margin-top:2px;display:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lyline.on .lysub{display:block}
  .ft{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);margin-top:auto}
  .dt{width:6px;height:6px;border-radius:var(--r9);background:var(--ok);flex:none;transition:background .3s}
  .dt.pz{background:#fbbf24}
  /* ---------- v2.3.0 提示芯片 ----------
   * seekNote 旧版只在 10.5px 页脚文案里，真机用户看不到（「拖动失败没有提示」）——
   * 现在改为进度条上方的醒目芯片；needsUpdate 常驻顶部（版本漂移从症状可见） */
  .chip{position:absolute;left:50%;transform:translateX(-50%);z-index:4;display:none;
    align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r9);
    font-size:11px;font-weight:550;white-space:nowrap;pointer-events:none;
    background:var(--ink);color:var(--card);box-shadow:0 3px 12px rgba(0,0,0,.22);}
  .chip.on{display:flex;animation:chipIn .3s var(--ez)}
  @keyframes chipIn{from{opacity:0;transform:translateX(-50%) translateY(-5px)}to{opacity:1;transform:translateX(-50%)}}
  .chip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .chip.warn{background:#b45309;color:#fff}
  /* ---------- 空态 ---------- */
  .em{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:7px;text-align:center;padding:12px}
  .em .ic{color:var(--acc66)}
  .em .e1{font-size:12.5px;font-weight:550;color:var(--ink)}
  .em .e2{font-size:11px;color:var(--ink3);line-height:1.5;max-width:250px}
  .hd{display:none!important}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden><defs>
  <polygon id="i-pl" points="8 4 20 12 8 20 8 4"/>
  <g id="i-pa"><rect x="6.6" y="4.6" width="3.6" height="14.8" rx="1.3"/><rect x="13.8" y="4.6" width="3.6" height="14.8" rx="1.3"/></g>
  <g id="i-pv"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></g>
  <g id="i-nx"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></g>
  <polyline id="i-dn" points="6 9 12 15 18 9"/>
</defs></svg>

<div class="card mode-em" id="card">
  <div class="fl" id="fl">
    <div class="rw">
      <div class="cw">
        <div class="glow"></div>
        <div class="he"><img id="aF" alt=""><span class="dot" id="dot"></span></div>
      </div>
      <div class="info">
        <div class="t1" id="t1">—</div>
        <div class="t2" id="t2"></div>
        <div class="t3" id="t3"></div>
      </div>
    </div>
    <button class="cx" id="cxB" aria-label="关闭面板"><svg viewBox="0 0 24 24"><use href="#i-dn"/></svg></button>
    <div class="sk" id="sk"><div class="rl"><i id="bar"></i><u id="th"></u></div>
      <div class="chip" id="noteChip"><svg viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span id="noteTxt"></span></div>
    </div>
    <div class="chip warn" id="updChip" style="top:8px"><span>组件过旧 · 更新「初始歌词源」.plugin 后重启网易云即可全自动修复</span></div>
    <div class="tm"><span id="tC">0:00</span><span id="tD">0:00</span></div>
    <div class="ct">
      <button class="bt" id="pv" aria-label="上一首"><svg viewBox="0 0 24 24"><use href="#i-pv"/></svg></button>
      <button class="bt mi" id="pB" aria-label="播放或暂停">
        <svg id="yI" viewBox="0 0 24 24" class="pc"><use href="#i-pl"/></svg>
        <svg id="nI" viewBox="0 0 24 24" class="off pc"><use href="#i-pa"/></svg>
      </button>
      <button class="bt" id="nx" aria-label="下一首"><svg viewBox="0 0 24 24"><use href="#i-nx"/></svg></button>
    </div>
    <div class="ly hd" id="ly"></div>
    <div class="ft"><span class="dt" id="dt"></span><span id="ap">已连接</span></div>
  </div>

  <div class="em" id="em">
    <svg class="ic" width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/></svg>
    <div class="e1" id="e1">系统媒体待接入</div>
    <div class="e2" id="e2">启动初始SMTC桥后接入</div>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
/* ============================================================
 * v2.0.0 音乐面板 —— 只写样式与渲染，零计算。
 * 数据面 = 宿主「初始」内建引擎 chushi.music：
 *   snapshot()/subscribe(cb) → 离散快照（封面/歌名/解析好的歌词结构/时长）
 *   now()                    → 实时态（position/progress/lineIndex/wordIndex/
 *                              wordProgress 均由宿主按 SMTC 时间戳预对齐）
 *   seek(s)/toggle/next/prev → 控制（seek 成功宿主自动乐观重锚）
 * 本文件不再包含任何 yrc/lrc 解析、时钟插值或锚点运算。
 * ============================================================ */
var card=$("card"),sk=$("sk");
var E={aF:$("aF"),t1:$("t1"),t2:$("t2"),t3:$("t3"),bar:$("bar"),th:$("th"),
  tC:$("tC"),tD:$("tD"),ap:$("ap"),dt:$("dt"),yI:$("yI"),nI:$("nI"),
  e1:$("e1"),e2:$("e2"),ly:$("ly"),noteChip:$("noteChip"),noteTxt:$("noteTxt"),updChip:$("updChip")};
var H={fl:248,em:92},LY_H=124;
var DEF="asset:cover.svg";
var snap=null,mode="em",lastKey="",drag=false,dragRatio=0;
var lyBox=E.ly,lyInr=null,lyEls=null,lyActive=-1,lyWords=null,lyMode=0,lyKey="__none__",lyRef=null;
var mus=window.chushi&&window.chushi.music?window.chushi.music:null;
function txt(el,v){if(el.textContent!==v)el.textContent=v}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+(s%60<10?"0":"")+s%60}
function hasLyric(){return !!(snap&&snap.lyric&&snap.lyric.lines&&snap.lyric.lines.length)}
function hFor(){return mode==="fl"&&hasLyric()?H.fl+LY_H:H[mode]}
function setMode(m){
  mode=m;card.className="card mode-"+m;
  $("em").classList.toggle("hd",m!=="em");
  try{chushi.resize(340,hFor())}catch(e){}
}
function cover(img){
  var src=(snap&&snap.cover)||(snap&&snap.coverUrl)||DEF;
  if(img.__s!==src){img.src=src;img.__s=src}
  img.classList.add("on");
}
/* 歌词 DOM：直接消费宿主解析好的行/词结构（t=文本 tr=翻译 w=词[{s,d,t}]） */
function buildLyric(){
  lyBox.innerHTML="";lyEls=[];lyWords=[];lyActive=-1;lyInr=null;
  if(!hasLyric()){lyBox.classList.add("hd");lyMode=0;return}
  var lines=snap.lyric.lines;lyMode=snap.lyric.mode;
  lyBox.classList.remove("hd");
  lyInr=document.createElement("div");lyInr.className="lyin";lyBox.appendChild(lyInr);
  for(var i=0;i<lines.length;i++){
    var L=lines[i],ln=document.createElement("div");
    ln.className="lyline"+(L.w&&L.w.length?"":" gap");
    var ws=[];
    if(lyMode===1&&L.w&&L.w.length){
      for(var j=0;j<L.w.length;j++){
        var sp=document.createElement("span");sp.className="lyw";
        sp.appendChild(document.createTextNode(L.w[j].t));
        var ov=document.createElement("span");ov.className="ov";ov.textContent=L.w[j].t;
        sp.appendChild(ov);
        ln.appendChild(sp);ws.push(sp);
      }
    }else{ln.textContent=L.t||"· · ·"}
    if(L.tr){var sub=document.createElement("div");sub.className="lysub";sub.textContent=L.tr;ln.appendChild(sub)}
    lyInr.appendChild(ln);
    lyEls.push(ln);lyWords.push(ws);
  }
}
/* 离散快照：曲目/封面/歌词/连接态变化才到（宿主签名广播） */
function render(){
  var s=snap;
  if(!s||!s.connected){
    txt(E.e1,"系统媒体待接入");txt(E.e2,"安装「初始歌词源」.plugin 后播放音乐即自动接入");
    txt(E.ap,"未连接");
    if(mode!=="em")setMode("em");
    return;
  }
  if(!s.title){
    txt(E.e1,"等待媒体会话");txt(E.e2,"在网易云等播放器放首歌即会亮起");
    if(mode!=="em")setMode("em");
    return;
  }
  /* 歌词键 = rev + 存在性 + 行数组引用（v2.1.0 加引用维）：
     切歌快照常携旧词载荷（宿主新词未到）——rev+存在性两维在「同 rev 下
     旧词→新词」时键不变，真词到位不再重建（真机「切歌后歌词概率加载
     不出来」的部件层孪生根因）；行数组引用只在宿主重解析后变化，作第三维。 */
  var lk=(s.lyricRev||"")+(s.lyric?"#1":"#0");
  var lr=s.lyric?s.lyric.lines:null;
  if(lk!==lyKey||lr!==lyRef){lyKey=lk;lyRef=lr;buildLyric();if(mode!=="em")setMode(mode)} /* 歌词到位/失效/换内容 → 重报高度 */
  var key=[s.title,s.artist,s.album,s.app].join("|");
  if(key!==lastKey){
    lastKey=key;
    var els=[E.t1,E.t2,E.t3];
    for(var i=0;i<els.length;i++){els[i].classList.remove("sw");void els[i].offsetWidth;els[i].classList.add("sw")}
  }
  txt(E.t1,s.title||"未知曲目");
  txt(E.t2,s.artist||"未知艺术家");
  txt(E.t3,s.album||"");
  /* v2.3.0 芯片：seekNote 醒目提示（3.8s 自动消失）；needsUpdate 常驻升级芯片 */
  var noteOn=!!s.seekNote;
  E.noteChip.classList.toggle("on",noteOn);
  if(noteOn)txt(E.noteTxt,s.seekNote);
  E.updChip.classList.toggle("on",!!s.needsUpdate);
  /* v2.3.0 页脚诊断：插件版本可见 = 插件心跳在场 + 版本漂移一眼可辨 */
  txt(E.ap, s.seekNote ? s.seekNote : ("已连接 · "+(s.app||"系统媒体")+(s.pluginVer?" · 插件 v"+s.pluginVer:"")));
  cover(E.aF);
  /* 乐观窗口内且真实态未到（s.playing≠optP）沿用乐观值；确认或超时即回真值 */
  var on;
  if(optAt&&Date.now()-optAt<2500&&s.playing!==optP){on=optP}
  else{on=!!s.playing;optAt=0}
  playVisual(on);
  if(mode==="em")setMode("fl");
}
/* 实时态：rAF 逐帧取宿主预计算结果（进度/时间/逐字高亮），本层零运算。
   v2.0.1：拖动中改渲染 dragRatio 预览——否则本循环每帧会用 now() 覆写进度条，
   拖动预览 16ms 内就被冲掉（真机「拖动没反应」的直接观感） */
function tick(){
  if(snap&&snap.connected&&snap.title&&mode!=="em"){
    if(drag){
      var dw=(dragRatio*100).toFixed(2)+"%";
      E.bar.style.width=dw;E.th.style.left=dw;
      txt(E.tC,fmt(dragRatio*(snap.duration||0)));
    }else{
      var n=mus?mus.now():null;
      if(n){
        var w=(n.progress*100).toFixed(2)+"%";
        E.bar.style.width=w;E.th.style.left=w;
        txt(E.tC,fmt(n.position));txt(E.tD,n.duration>0?fmt(n.duration):"--:--");
        lyricFrame(n);
      }
    }
  }
  requestAnimationFrame(tick);
}
function lyricFrame(n){
  if(!lyEls||!lyEls.length)return;
  var idx=n.lineIndex;
  if(idx!==lyActive){
    if(idx>=0&&idx<lyEls.length){
      lyActive=idx;
      for(var k=0;k<lyEls.length;k++)lyEls[k].classList.toggle("on",k===idx);
      var el=lyEls[idx];
      var target=(lyBox.clientHeight-el.offsetHeight)/2-el.offsetTop;
      if(lyInr)lyInr.style.transform="translateY("+target.toFixed(1)+"px)";
    }
  }
  if(lyMode===1&&lyActive>=0){
    var ws=lyWords[lyActive];
    for(var wI=0;wI<ws.length;wI++){
      var p=wI===n.wordIndex?n.wordProgress:(wI<n.wordIndex?1:0);
      /* v2.0.1：只写 --p 一个变量（clip-path 裁剪显色），无 class 摘挂无 background-clip */
      ws[wI].style.setProperty("--p",(p*100).toFixed(1)+"%");
    }
  }
}
requestAnimationFrame(tick);
/* 控制：v2.0.1 播放/暂停乐观翻转——真翻转最迟零点几秒后由快照确认/纠正，
   不再等下一轮询才变图标（真机「按钮反应太慢」） */
var optP=false,optAt=0;
function playVisual(on){
  /* v2.1.0：.off 交叉淡切（不再用 .hd 硬 display 切换——过渡中两图标同在，
     质量连续无跳变） */
  E.yI.classList.toggle("off",on);E.nI.classList.toggle("off",!on);
  E.dt.classList.toggle("pz",!on);card.classList.toggle("pl",on);
  E.aF.classList.toggle("pz",!on);
}
$("pB").addEventListener("click",function(){
  var cur=(optAt&&Date.now()-optAt<2500)?optP:!!(snap&&snap.playing);
  optP=!cur;optAt=Date.now();playVisual(optP);
  try{mus.toggle()}catch(e){}
});
$("nx").addEventListener("click",function(){try{mus.next()}catch(e){}});
$("pv").addEventListener("click",function(){try{mus.prev()}catch(e){}});
$("cxB").addEventListener("click",function(){try{chushi.close()}catch(e){}});
/* seek：按住拖动（拖动预览按比例显示），松手提交——宿主 seek 成功自动乐观重锚 */
function ratio(e){
  var r=sk.getBoundingClientRect();
  return Math.min(1,Math.max(0,(e.clientX-r.left)/Math.max(1,r.width)));
}
sk.addEventListener("pointerdown",function(e){
  if(!snap||!(snap.duration>0))return;
  drag=true;dragRatio=ratio(e);
  sk.setPointerCapture(e.pointerId);
});
sk.addEventListener("pointermove",function(e){if(drag){
  dragRatio=ratio(e);
  var w=(dragRatio*100).toFixed(2)+"%";
  E.bar.style.width=w;E.th.style.left=w;
  txt(E.tC,fmt(dragRatio*snap.duration));
}},{passive:true});
sk.addEventListener("pointerup",function(){
  if(!drag)return;drag=false;
  if(snap&&snap.duration>0){try{mus.seek(dragRatio*snap.duration)}catch(e){}}
});
/* 订阅离散快照（订阅即回推当前值） */
if(mus){
  try{mus.subscribe(function(s){snap=s;render()})}catch(e){}
}else{
  txt(E.e1,"宿主版本过旧");txt(E.e2,"请更新「初始」后再导入本预设");
}
setMode("em");
})();
</script>
