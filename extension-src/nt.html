<!doctype html>
<!-- 「初始」新标签页入口跳板（v8.5.4）
     覆盖页 URL 被浏览器特殊对待：只要顶层文档就是覆盖页本身，地址栏既不显示
     扩展地址、又会被浏览器抢着聚焦（用户实测：开着「不聚焦地址栏」也无效）。
     v8.3.7 实测过唯一可靠的手段 —— 页面自发的一次顶层导航会让地址栏让出焦点
     并显示扩展地址。故把覆盖页退化成纯跳板：立刻 replace 到 shell.html
     （非覆盖页路径），壳的路由/快照/浮窗/桥一切不变。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>初始</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
      }
    </style>
    <script src="nt.js"></script>
  </head>
  <body></body>
</html>
